# 쓰레드 단문 풀 — 카드뉴스와 별개로 하루 몇 개씩 나가는 텍스트 글.
#
# 규칙
#  1. 손으로 쓴다. 생성하면 말투가 한 패턴으로 수렴해서 티가 난다.
#  2. 금액은 출처로 확인한 것만 쓴다. 확인 못 한 숫자는 아예 빼고 구조만 말한다.
#  3. 주제 태그(topic_tag)는 글당 하나만 달 수 있다. 마침표·앰퍼샌드는 못 쓴다.
#  4. 해시태그는 넣지 않는다. 쓰레드에서는 태그 나열이 광고처럼 읽힌다.
#  5. 본문 500자 이하. 3~6줄이 기본.
#
# enabled 가 false 면 아무것도 올리지 않는다.
# 태그는 render() 가 본문 끝에 "#태그" 한 개로 붙인다 — 쓰레드는 글당 태그 1개만 유효하다.
enabled: true

posts:
  - id: mp001-taxi-four
    topic_tag: 비교분석
    text: |-
      택시가 지하철보다 싼 경우를 계산해봤는데 딱 하나 있었음.

      서울 중형택시 기본요금 4,800원, 지하철 1,550원.
      넷이 타고 3.4km 안쪽. 그거 말고는 전부 짐.
      셋이 타도 4,650원이라 기본요금조차 못 넘김.

      마지막으로 택시에 넷이 꽉 채워 탄 게 언제임?

  - id: mp002-annual-ten-months
    topic_tag: 구독서비스
    text: |-
      연간결제 '2개월 무료'는 사실 조건이 붙은 말임.

      Microsoft 365 개인이 월 12,500원 / 연 125,000원.
      연간가가 딱 10개월치임.
      그러니까 10개월 넘게 안 쓰면 월결제가 더 쌈.

      '1년 쓸까'가 아니라 '10개월은 쓸까'를 물어야 하는 거였음.

  - id: mp003-refurb-fifteen
    topic_tag: 전자제품
    text: |-
      리퍼 살 때 할인율부터 보면 순서가 틀림.

      애플 공식 리퍼가 최대 15%임. 대신 보증이 신품과 같은 1년.
      그럼 30% 싼 리퍼는 그 15%만큼 뭘 뺀 거임.

      보통 보증 기간에서 빠짐.
      할인율 말고 빠진 걸 세는 게 맞음.

  - id: mp004-printer-pages
    topic_tag: 전자제품
    text: |-
      프린터를 본체값으로 고르면 거의 틀림.

      엡손 에코탱크 프로는 동봉 잉크만으로 흑백 7,500장 나온다고 돼 있음.
      싼 본체는 살 때 싸고 쓸 때마다 비쌈.

      근데 1년에 500장도 안 뽑는 사람이면 그 차이가 생기기 전에 프린터를 바꾸게 됨.
      작년에 몇 장 뽑았는지 알고 있음?

  - id: mp005-subscription-sweep
    topic_tag: 구독서비스
    text: |-
      구독 정리하는 제일 빠른 방법.

      결제 내역 열고, 최근 세 달 동안 두 번 이상 안 쓴 걸 지우면 끝임.
      '언젠가 쓸 것 같아서' 남긴 건 그 언젠가가 안 옴.

      고민되는 게 하나쯤 떠올랐으면 그게 정답임.

  - id: mp006-free-shipping-threshold
    topic_tag: 쇼핑
    text: |-
      무료배송 채우려고 뭘 더 담는 순간 이미 진 거임.

      배송비보다 비싼 걸 담으면 손해고,
      싼 걸 담으면 안 살 걸 산 거임.

      둘 다 아닌 경우가 진짜 드묾.

  - id: mp007-discount-cap
    topic_tag: 쇼핑
    text: |-
      할인율 큰 쿠폰이 할인액도 큰 건 아님.

      30% 쿠폰에 최대 5천원 한도가 붙어 있으면
      17,000원 넘게 사는 순간부터는 그냥 정액 5천원 쿠폰임.

      쿠폰 받으면 퍼센트 말고 한도부터 보게 됨.

  - id: mp008-membership-net
    topic_tag: 절약
    text: |-
      유료 멤버십은 '할인 얼마 받았나'가 아니라
      '회비 빼고 남았나'로 봐야 함.

      할인 총액이 회비보다 크면 유지, 작으면 해지.
      계산은 이게 전부인데 이걸 안 해봄.

      올해 회비 얼마 냈는지는 기억남?

  - id: mp009-bulk-leftover
    topic_tag: 절약
    text: |-
      대용량이 싼 건 다 썼을 때 얘기임.

      30% 싸게 샀는데 30% 남기고 버리면 단가가 똑같아짐.
      절반만 쓰면 오히려 비싸지고.

      싱크대 아래에 그런 거 하나쯤 있지 않음?

  - id: mp010-warranty-window
    topic_tag: 전자제품
    text: |-
      가전 살 때 제일 안 보는 숫자가 보증 기간임.

      본체 보증이랑 핵심 부품 보증이 다른 경우가 많음.
      싼 모델이 본체만 1년이고, 비싼 모델이 부품까지 길게 가는 식.

      가격표보다 그 줄이 더 비쌀 때가 있음.

  - id: mp011-installment-zero
    topic_tag: 재테크
    text: |-
      무이자 할부가 공짜인 건 맞는데, 그게 유리하다는 뜻은 아님.

      일시불 할인이 붙는 곳이면 그 할인만큼이 할부 비용임.
      무이자라서 이득이 아니라, 일시불 할인을 포기한 거임.

      둘 다 되는 곳에서 뭐 골랐는지 기억남?

  - id: mp012-price-alert
    topic_tag: 쇼핑
    text: |-
      가격 알림 걸어두면 싸게 산다는 말, 반은 맞음.

      알림이 오면 사게 되니까 안 살 것도 사게 됨.
      살 게 정해진 물건에만 걸어야 도구가 됨.

      지금 걸려 있는 알림 중에 진짜 살 건 몇 개임?

  - id: mp013-commute-cost
    topic_tag: 자취
    text: |-
      회사 앞 자취 vs 통근, 월세 차이만 보면 안 됨.

      왕복 시간에 본인 시급을 곱해야 숫자가 맞음.
      교통비는 그다음이고.

      시간값을 0으로 두니까 통근이 늘 싸 보이는 거임.

  - id: mp014-cheap-replace
    topic_tag: 소비습관
    text: |-
      싼 걸 두 번 사면 비싼 거 한 번 값이 됨.

      근데 이건 '두 번 살 물건'일 때만 맞는 말임.
      한 번 쓰고 말 거면 싼 게 그냥 싼 거고.

      몇 번 쓸 건지부터 정하면 고민이 절반으로 줄어듦.

  - id: mp015-trial-calendar
    topic_tag: 구독서비스
    text: |-
      무료체험 시작할 때 해야 할 일 하나.

      결제일 하루 전으로 알람 걸어두기.
      이거 안 하면 무료체험이 아니라 유료 가입임.

      지금 걸려 있는 체험 몇 개인지 알고 있음?

  - id: mp016-rental-total
    topic_tag: 비교분석
    text: |-
      렌탈이 싼지 보려면 월 렌탈료에 약정 개월을 곱해봐야 함.

      그 총액이 구매가보다 크면, 차액이 관리비임.
      관리를 진짜 받는지가 그다음 질문이고.

      마지막 방문 점검이 언제였는지 기억남?

  - id: mp017-electricity-standby
    topic_tag: 생활정보
    text: |-
      대기전력 아끼려고 코드 뽑는 거, 효과 자체는 있음.

      근데 냉장고 빼고 나머지 다 합쳐도 금액이 크진 않음.
      에어컨 설정 온도 1도가 훨씬 큼.

      작은 걸 열심히 하고 큰 걸 안 건드리는 경우가 많음.

  - id: mp018-phone-plan-usage
    topic_tag: 통신비
    text: |-
      요금제 바꾸기 전에 볼 건 딱 하나임.

      지난 3개월 실제 데이터 사용량.
      통신사 앱에 다 나와 있음.

      무제한 쓰는 사람 중에 실제로 무제한이 필요한 사람은 생각보다 적음.

  - id: mp019-second-device
    topic_tag: 전자제품
    text: |-
      '이거 사면 저것도 사야 함' 목록을 먼저 적어보면 좋음.

      카메라면 렌즈랑 메모리, 프린터면 종이랑 잉크.
      본체값만 비교하면 항상 싼 쪽이 이김.

      근데 그 싼 쪽이 딸린 게 더 비싼 경우가 많음.

  - id: mp020-return-window
    topic_tag: 쇼핑
    text: |-
      반품 기간은 '마음이 바뀔 시간'이 아니라 '확인할 시간'임.

      받자마자 박스 열고 켜보는 게 제일 이득.
      일주일 미루면 확인할 시간도 같이 사라짐.

      아직 안 뜯은 택배 있음?

  - id: mp021-coupon-minimum
    topic_tag: 쇼핑
    text: |-
      '2만원 이상 3천원 할인' 쿠폰에 만 오천원짜리 담고 뭘 더 넣는 순간,
      3천원 받으려고 5천원을 더 쓴 거임.

      쿠폰은 원래 살 게 조건을 넘길 때만 쿠폰임.

  - id: mp022-old-plan-drift
    topic_tag: 통신비
    text: |-
      예전에 좋았던 요금제가 지금도 좋을 확률은 낮음.

      요금제는 계속 새로 나오는데 내 건 그대로 있음.
      2년 이상 안 바꿨으면 한 번 볼 때 됐음.

      마지막으로 요금제 확인한 게 언제임?

  - id: mp023-time-vs-money
    topic_tag: 소비습관
    text: |-
      싼 데 찾느라 30분 쓰는 게 아까운지 아닌지는
      아낀 금액을 30분으로 나눠보면 바로 나옴.

      그게 시급보다 낮으면 그냥 가까운 데서 사는 게 맞음.
      매번 다 비교하려다 지쳐서 아무것도 못 바꾸는 게 제일 손해고.

  - id: mp024-cloud-tier
    topic_tag: 구독서비스
    text: |-
      클라우드 용량 올릴 때, 지금 몇 퍼센트 쓰고 있는지부터 보면 됨.

      70% 넘었으면 올릴 때 맞고,
      30%인데 올리는 건 나중에 쓸 자리에 미리 돈 내는 거임.

      지금 몇 퍼센트인지 바로 답 나옴?

  - id: mp025-repair-vs-replace
    topic_tag: 비교분석
    text: |-
      수리비가 새 거 값의 절반을 넘으면 보통 바꾸는 게 맞음.

      근데 이건 남은 수명이 비슷할 때 얘기고,
      3년 쓴 걸 고치면 남은 게 3년이 아님.

      수리비 말고 '고치면 몇 년 더 쓰나'를 물어봐야 함.

  - id: mp026-delivery-minimum
    topic_tag: 생활정보
    text: |-
      배달 최소주문금액 맞추려고 사이드 추가하는 거,
      그 사이드가 먹고 싶은 거였는지 생각해보면 답 나옴.

      아니었으면 배달비를 음식값으로 바꿔 낸 것뿐임.

  - id: mp027-annual-fee-card
    topic_tag: 재테크
    text: |-
      연회비 있는 카드가 손해인지 아닌지는
      작년에 받은 혜택 총액에서 연회비를 빼보면 끝임.

      카드사 앱에 혜택 내역이 다 있음.
      빼서 음수면 다음 해는 안 쓰면 됨.

  - id: mp028-gym-attendance
    topic_tag: 절약
    text: |-
      1년권이 싼 건 1년 다닐 때 얘기임.

      1년권을 회당 가격으로 바꾸려면 실제로 간 횟수로 나눠야 함.
      주 1회 가면 한 달권보다 비싼 경우도 나옴.

      작년에 몇 번 갔는지 세어본 적 있음?

  - id: mp029-spec-you-use
    topic_tag: 전자제품
    text: |-
      스펙 올릴 때 기준은 '더 좋은가'가 아니라 '내가 쓰나'임.

      쓰지 않는 성능은 성능이 아니라 그냥 가격임.
      뭘 하려고 사는지 한 줄로 못 쓰면 아직 고를 때가 아님.

  - id: mp030-one-in-one-out
    topic_tag: 소비습관
    text: |-
      하나 사면 하나 버리기, 해보면 생각보다 많이 걸림.

      버릴 게 안 떠오르면 자리가 없는 거고,
      자리가 없으면 그건 필요한 게 아니었음.

      이번 주에 산 것 중에 하나 버릴 수 있음?

# ── 맞팔(스하리)용 ──────────────────────────────────────────────
# 밤 슬롯(21:40)에서만 꺼낸다. 콘텐츠 글에 스하리를 걸면 주제 노출을 버리게 된다.
# 맞팔만 조르는 글은 팔로우해도 금방 언팔당한다. 매 편에 대화 주제를 하나씩 넣는다.
# 이 글들은 '선팔하면 맞팔한다'고 약속한다 — 실제로 눌러줘야 성립한다.

  - id: sp001-taxi-four
    track: soft
    topic_tag: 스하리1000명프로젝트
    text: |-
      스하리 하러 왔는데 맞팔만 하긴 심심하니까 하나 던짐.

      택시가 지하철보다 싼 경우, 딱 하나 있음.
      넷이 타고 3.4km 안쪽. 그거 넘어가면 전부 짐.

      넷이 꽉 채워 타본 게 언제임?
      선팔 주면 맞팔하고 글도 읽으러 감.

  - id: sp002-subscription-ask
    track: soft
    topic_tag: 스하리1000명프로젝트
    text: |-
      스친 구하면서 질문 하나.

      구독 중에 '이거 왜 아직 내고 있지' 싶은 거 하나쯤 있지 않음?
      나는 그런 거 계산해서 올리는 계정임.

      답글에 하나 적어주면 그걸로 계산해서 올려볼게.

  - id: sp003-annual-ten
    track: soft
    topic_tag: 스하리1000명프로젝트
    text: |-
      연간결제 '2개월 무료' 보면 그냥 누르게 되는데,
      사실 10개월 넘게 안 쓰면 손해임.

      MS 365 기준 월 12,500원 / 연 125,000원. 연간가가 딱 10개월치더라.

      작년에 연간 걸어놓고 중간에 안 쓴 거 있음?

  - id: sp004-worth-it
    track: soft
    topic_tag: 스하리
    text: |-
      스친들한테 궁금한 거.

      최근에 산 것 중에 '이건 돈값 했다' 싶은 거 뭐임?
      나는 반대로 돈값 못한 걸 계산해서 올리는 편인데 성공 사례도 궁금함.

      하나만 적어줘. 선팔 주면 맞팔함.

  - id: sp005-refurb
    track: soft
    topic_tag: 스하리1000명프로젝트
    text: |-
      리퍼 살 때 할인율부터 보면 순서가 틀림.

      애플 공식 리퍼가 최대 15%인데 보증은 신품이랑 같은 1년임.
      그럼 30% 싼 리퍼는 그 차이만큼 뭘 뺀 거고.

      리퍼 써본 사람 있음? 후기 궁금함.

  - id: sp006-free-shipping
    track: soft
    topic_tag: 스하리1000명프로젝트
    text: |-
      스친 모집 겸 질문.

      무료배송 채우려고 뭐 더 담은 적 있음?
      그 순간 배송비를 물건값으로 바꿔 낸 거라 계산상 거의 항상 짐.

      나만 그런 거 아니지?

  - id: sp007-bulk
    track: soft
    topic_tag: 스하리
    text: |-
      대용량이 싼 건 다 썼을 때 얘기임.

      30% 싸게 샀는데 30% 남기고 버리면 단가가 똑같아짐.
      절반만 쓰면 오히려 비싸지고.

      싱크대 아래에 그런 거 하나쯤 있지 않음?

  - id: sp008-phone-plan
    track: soft
    topic_tag: 스하리1000명프로젝트
    text: |-
      요금제 바꾸기 전에 볼 건 딱 하나임.
      지난 3개월 실제 데이터 사용량. 통신사 앱에 다 나와 있음.

      무제한 쓰는 사람 중에 진짜 무제한 필요한 사람은 생각보다 적더라.

      본인 한 달에 몇 기가 쓰는지 알고 있음?

  - id: sp009-printer
    track: soft
    topic_tag: 스하리1000명프로젝트
    text: |-
      프린터는 본체값으로 고르면 거의 틀림.

      엡손 에코탱크는 동봉 잉크만으로 흑백 7,500장 나온다고 돼 있음.
      근데 1년에 500장도 안 뽑으면 그 차이가 생기기 전에 프린터를 바꾸게 됨.

      작년에 몇 장 뽑았는지 기억남?

  - id: sp010-how-far
    track: soft
    topic_tag: 스하리
    text: |-
      스친들 의견 궁금함.

      싼 데 찾느라 30분 쓰는 거, 아낀 금액을 30분으로 나눠보면 답 나옴.
      시급보다 낮으면 그냥 가까운 데서 사는 게 맞는데 그게 또 잘 안 되더라.

      다들 어디까지 비교하고 삼?

  - id: sp011-installment
    track: soft
    topic_tag: 스하리1000명프로젝트
    text: |-
      무이자 할부가 공짜인 건 맞는데 유리하다는 뜻은 아님.

      일시불 할인이 있는 곳이면 그 할인만큼이 할부 비용이거든.
      무이자라서 이득이 아니라 일시불 할인을 포기한 거임.

      둘 다 되는 곳에서 뭐 골랐는지 기억남?

  - id: sp012-tone
    track: soft
    topic_tag: 스하리1000명프로젝트
    text: |-
      스친 구함.

      여기 글 길이는 다 이 정도임. 서너 줄에 숫자 하나랑 결론 하나.
      길게 안 쓰고 '아껴라' 소리도 안 함.

      이런 톤 괜찮으면 팔로우해줘. 바로 맞팔함.

  - id: sp013-return-window
    track: soft
    topic_tag: 스하리1000명프로젝트
    text: |-
      반품 기간은 '마음이 바뀔 시간'이 아니라 '확인할 시간'임.

      받자마자 뜯어서 켜보는 게 제일 이득인데 자꾸 일주일씩 미루게 됨.
      그러다 확인할 시간도 같이 사라지고.

      아직 안 뜯은 택배 있는 사람?

  - id: sp014-mutual-means
    track: soft
    topic_tag: 스하리1000명프로젝트
    text: |-
      스하리 하면서 느낀 건데,
      맞팔만 늘리고 글 안 읽으면 서로 의미 없더라.

      그래서 맞팔한 사람 글은 진짜 읽으려고 함. 대신 나도 읽을 만한 거 올릴게.

      요즘 뭐 사기 전에 제일 고민되는 거 하나만 적어줘.
