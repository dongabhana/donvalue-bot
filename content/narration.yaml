# 편별 나레이션 대본 — 영상에서 '말로 하는' 내용
#
# ■ 제일 중요한 원칙: 화면 글자를 읽지 않는다
#   화면은 숫자와 결론을 '보여주고', 목소리는 그 숫자가 왜 중요한지를 '말한다'.
#   둘이 같은 말을 하면 보는 사람은 둘 다 안 듣는다.
#
# ■ 말투
#   반말 구어체. "~야, ~거든, ~잖아". 문어체("~이다", "~합니다")는 쓰지 않는다.
#   인스타 캡션은 해요체 그대로 두고 영상 목소리만 반말이다.
#
# ■ 훅 (hook)
#   첫 1.5초에 승부가 난다. 규칙 세 개.
#     1) 첫 단어에 제품명 또는 금액이 나온다
#     2) 손해·반전을 먼저 말한다. 설명은 그 다음
#     3) 20자 안팎. 길면 훅이 아니라 설명이다
#
# ■ 리듬
#   짧은 문장으로 끊는다. 중간에 "근데 진짜 함정은 여기" 같은 전환 한 마디를
#   넣어 귀를 다시 잡는다. 숫자는 한 문장에 하나만.
#
# ■ 칸 설명
#   hook     표지 장면. 제일 중요
#   stake    왜 이게 문제인지 한 줄
#   beats    본문 카드 순서 그대로. 카드가 빠져도 나머지는 자기 대사를 유지
#   verdict  결론. 단정형으로 끝낸다
#   loop     마지막 참여 유도. 질문으로 끝낸다
#
# 대본이 없는 편은 화면 문구를 그대로 읽는다(딱딱하다). 새 편을 낼 때
# 여기에 대본을 추가하면 그때부터 제대로 말한다.

001-coupang-wow:
  hook: 쿠팡 와우 월 7890원, 본전 뽑는 사람 생각보다 적어.
  stake: 혜택 목록부터 보면 무조건 이득처럼 보이거든? 그게 함정이야.
  beats:
    - 계산은 하나만 하면 돼. 무료배송 몇 번 썼냐, 곱하기 배송비. OTT니 반품이니는 전부 덤으로 쳐.
    - 비회원은 19800원 안 되면 배송비가 붙어. 그런 주문이 한 달에 세 번이면 본전, 두 번이면 손해야.
    - 근데 진짜 함정은 여기. 무료배송이라고 원래 안 살 걸 담기 시작하면, 아낀 배송비보다 더 나가. 구독료가 문제가 아니라 습관이 문제인 거지.
    - 혼자 살면서 생필품 찔끔찔끔 시키면 무조건 남아. 반대로 한 달에 한두 번 몰아 사는 집은 그냥 돈 버리는 거고.
  verdict: 지난달 무료배송 세 번 넘게 썼으면 유지, 아니면 해지가 답이야.
  loop: 주문 내역 한 번만 세봐. 너는 몇 번이었어?

002-water-purifier:
  hook: 정수기 월 26900원. 이거 본전 뽑으려면 하루에 물 몇 리터 마셔야 할까?
  stake: 렌탈은 월 얼마, 생수는 묶음 얼마. 단위가 다르니까 비교가 안 되는 거야.
  beats:
    - 질문을 바꾸면 바로 나와. 렌탈료를 생수 한 병 값으로 나눠봐. 하루 몇 리터를 마셔야 본전인지가 딱 떨어져.
    - 브랜드 생수 1200원짜리로 나누면 스물두 병. 하루 1.5리터야. 성인 권장량이 2리터쯤이니까 혼자 살아도 넘기는 양이지.
    - 근데 최저가 500원짜리로 바꿔보면? 쉰네 병, 하루 3.6리터. 1인 가구가 이걸 마시긴 어렵잖아. 이 경우엔 생수가 이겨.
    - 그래서 갈림길은 딱 하나야. 무슨 물을 마시냐. 가족 수가 늘면 둘 다 정수기 쪽으로 기울고.
  verdict: 브랜드 생수 마시면 정수기가 이득, 최저가로 충분하면 생수가 이득이야.
  loop: 너는 지금 어떤 물 마셔?

004-ott-stack:
  hook: OTT 네 개 구독 중인데, 시간당 얼마 내는지 세본 적 있어?
  stake: 요금은 다 비슷해. 갈리는 건 본 시간이야.
  beats:
    - 둘 다 월 만원이라고 쳐. A는 스무 시간 봤고 B는 두 시간 봤어. 같은 돈인데 단가는 같을까?
    - A는 시간당 500원, B는 5000원. 열 배 차이야. 요금제를 바꾼 게 아니라 그냥 안 본 것뿐인데.
    - 그렇다고 단가 낮다고 무조건 해지하란 건 아니야. 기다리는 작품이 있으면 그건 그것대로 값을 하거든.
    - 지난달에 한 번도 안 켠 거 하나만 골라봐. 해지하고 보고 싶어질 때 다시 붙이면 돼.
  verdict: 요금표 말고 지난달 시청 시간부터 봐. 거기 답이 다 있어.
  loop: 네 개 중에 안 본 거, 몇 개야?

005-mvno:
  hook: 알뜰폰 월 12000원 싸다길래 갈아탔는데, 1년 지나니까 남은 게 24000원이었어.
  stake: 첫 달 광고 요금만 보면 무조건 이득처럼 보이거든.
  beats:
    - 지금 31000원 내고 있고, 새 요금은 첫 6개월 19000원, 그 뒤로 39000원이라고 쳐.
    - 첫 6개월은 매달 12000원씩 아껴. 합치면 72000원. 여기까지만 보면 개이득이지.
    - 근데 다음 6개월은 반대로 매달 8000원씩 더 내. 48000원. 1년 합치면 남은 건 24000원, 저녁 한 끼야.
    - 여기에 위약금이랑 결합할인 빠지는 것까지 더하면 마이너스 나는 집도 있어.
  verdict: 첫 달 말고 할인 끝난 뒤 요금으로, 12개월 총액을 비교해.
  loop: 너 지금 요금제, 할인 끝난 금액 알고 있어?

007-dishwasher:
  hook: 식기세척기 80만원. 비싸 보이는데, 하루로 나누면 731원이야.
  stake: 기계값만 보면 비싸고, 내 시간을 넣으면 얘기가 달라져.
  beats:
    - 구매랑 설치까지 80만원이라고 쳐. 중요한 건 가격이 아니라 3년 동안 몇 번 쓰냐야.
    - 매일 돌리면 3년에 1095번. 한 번에 731원이야. 커피 한 잔에 하루 설거지를 넘기는 셈이지.
    - 근데 주 2회만 돌리면 312번, 한 번에 2564원으로 뛰어. 같은 기계인데 세 배가 넘어.
    - 그리고 하나 더. 예비세척하고 수납하고 꺼내는 시간까지 따져봐. 손이 진짜 줄어드는지가 핵심이야.
  verdict: 아낀 시간이 자동으로 돈이 되진 않아. 몇 번 돌릴지부터 정하고 사.
  loop: 너희 집은 일주일에 몇 번 돌릴 것 같아?

008-commute-vs-rent:
  hook: 회사 앞으로 이사하면 월 12만원 더 나가. 대신 22시간이 생겨.
  stake: 한 줄만 계산하면 이사할지 말지 정해져.
  beats:
    - 회사 근처로 옮겨서 월세가 20만원 오르고, 교통비는 8만원 준다고 쳐.
    - 실제로 더 나가는 현금은 12만원이야. 20에서 8을 뺀 거지. 관리비나 이사비는 따로 봐야 하고.
    - 왕복 한 시간씩 22일이면 22시간. 12만원 나누기 22하면 시간당 5455원. 되찾는 한 시간에 그만큼 내는 셈이야.
    - 근데 시급만으로 정하지는 마. 지하철에서 자거나 공부하는 사람한테는 그 시간이 버린 시간이 아니거든.
  verdict: 현금 차액이랑 되찾는 시간, 둘을 따로 놓고 봐야 답이 나와.
  loop: 네 통근 한 시간, 얼마짜리 같아?

cx001-free-shipping:
  hook: 배송비 3000원 아끼려다 2900원 더 썼어.
  stake: 무료배송 버튼에는 안 보이는 가격표가 붙어 있거든.
  beats:
    - 장바구니가 27900원이야. 3만원부터 무료배송이고, 그 아래는 배송비 3000원.
    - 2100원만 더 담으면 되는데, 눈에 들어온 건 딱히 필요 없는 5900원짜리.
    - 자, 무료배송은 됐어. 근데 합계가 33800원이야. 그냥 배송비 내고 샀으면 30900원이었는데.
  verdict: 무료라는 글자 말고 마지막 합계를 봐. 원래 살 물건이면 합배송이 맞고, 아니면 거기서 멈춰.
  loop: 너희 집에도 배송비 대신 산 물건 있지? 그거 잘 썼어?

cx004-laptop-total:
  hook: 70만원짜리 노트북인데, 결제 끝나면 90만원이야.
  stake: 가격표 밖에 계산이 한 장 더 있거든.
  beats:
    - 본체는 70만원 맞아. 근데 쓸 수 있게 만들려면 허브 5만원, 저장장치 10만원, 메모리 5만원이 더 붙어.
    - 20만원이 본체값에서 빠져 있었던 거야. 비교는 70만원끼리 했는데 실제로 낸 건 90만원이지.
    - 물론 이미 갖고 있는 부품이면 얘기가 달라져. 그래서 확장이 되는지부터 봐야 하는 거고.
  verdict: 본체 가격 옆에 지금 당장 더 살 것들을 적어봐. 견적은 한 장이면 끝나.
  loop: 전자기기 사고 나서 예상 밖으로 더 산 거, 뭐였어?

cx005-coupon-minimum:
  hook: 5천원 쿠폰 썼는데 4천원을 더 냈어.
  stake: 쿠폰 조건이 내 장바구니보다 비쌀 때 벌어지는 일이야.
  beats:
    - 원래 살 건 36000원어치. 근데 쿠폰은 4만원부터야. 그래서 9천원짜리를 하나 더 담았어.
    - 합계 45000원에서 5000원 빠지니까 40000원. 할인은 분명 받았는데 원래보다 4천원을 더 낸 거야.
    - 그 9천원짜리가 원래 필요했던 거면 잘 산 거 맞아. 문제는 계획에 없던 걸 담았을 때지.
  verdict: 쿠폰 금액 말고 결제 총액을 비교해. 쿠폰 안 썼을 때랑 나란히 놓고.
  loop: 쿠폰 조건 맞추려고 뭘 더 담아봤어?

cx008-robot-prep:
  hook: 로봇청소기 샀는데 내가 바닥을 먼저 치우고 있어.
  stake: 청소 시간은 줄었는데 준비 시간이 생긴 거지.
  beats:
    - 버튼 누르기 전에 케이블 걷고, 양말 줍고, 장난감 치우고. 이게 매번이야.
    - 자동이라고 손이 아예 안 가는 건 아니야. 청소 시간만 보지 말고 준비랑 뒤처리까지 합쳐서 봐야 해.
    - 좋은 가전이냐보다 우리 집에 맞냐가 먼저야. 집 구조랑 사는 방식에 따라 완전히 달라지거든.
  verdict: 제품 사진 말고 우리 집 바닥 사진을 봐. 거기 치울 게 몇 개인지가 답이야.
  loop: 돌리기 전에 제일 먼저 치우는 거, 뭐야?

# ── 2026-09 신규 16편 (027~042) ──
# 트랙 성격: '단일 대상의 숨은 비용'. 화면은 숫자를 보여주고,
# 목소리는 그 숫자가 왜 아무도 안 세는 항목인지를 말한다.

027-giftcon-expiry:
  hook: 작년에 받은 기프티콘 네 장, 그냥 증발했어.
  stake: 받을 땐 내 돈이 아니라서 아무도 안 세거든. 그래서 조용히 사라져.
  beats:
    - 생일에 받은 거니까 공짜라고 생각하잖아. 근데 안 쓰면 그냥 0원이 되는 거야. 공짜가 아니라 마이너스인 거지.
    - 연 열두 장 받아서 네 장 넘겼다고 쳐봐. 장당 6000원만 잡아도 24000원이야. 3년이면 7만원이 넘어.
    - 근데 진짜 중요한 건 여기야. 기간 지나도 끝이 아니거든. 발행사에 따라 5년 안에 청구하면 90%까지 돌려받아. 대신 자동으로는 절대 안 줘.
    - 선물함 열어서 유효기간 순으로 정렬하고, 한 달 안에 만료되는 것만 캘린더에 옮겨. 5분이면 끝나.
  verdict: 기프티콘은 받는 순간이 아니라 쓰는 순간에 돈이 돼.
  loop: 지금 선물함 열어봐. 만료 임박 몇 개야?

028-point-expiry:
  hook: 1% 적립이라는데, 내가 실제로 받은 건 0.6%였어.
  stake: 쌓이는 비율이랑 받는 비율은 다른 거야. 그걸 같은 걸로 보니까 계산이 틀어져.
  beats:
    - 적립 1%는 쌓이는 비율이지 받는 비율이 아니야. 쌓인 것 중에 사라지는 게 있으면 실제로 받은 건 그보다 적어.
    - 연 2000만원 써서 20만원이 쌓였는데 8만원을 못 쓰고 넘겼다고 쳐봐. 손에 들어온 건 12만원, 실질로는 0.6%야.
    - 즉시할인 2%짜리는 소멸이 없어. 2%면 2%를 다 받아. 숫자로는 1 대 2 같은데 실제로는 세 배 넘게 벌어지는 거지.
    - 왜 못 쓰냐면 최소 사용 단위 때문이야. 1000점부터 쓸 수 있으면 900점은 영원히 묶여. 이런 잔돈이 계정마다 쌓여 있어.
  verdict: 소멸되는 적립은 적립이 아니야. 실질 적립률로 비교해.
  loop: 작년에 소멸된 포인트, 얼마였어?

029-retention-discount:
  hook: 해지 누르니까 반값을 주더라. 그럼 원래 값은 뭐였을까?
  stake: 같은 서비스를 쓰면서 서로 다른 돈을 내고 있는 거야.
  beats:
    - 많은 서비스가 해지 마지막 단계에서 할인을 꺼내. 안 눌러본 사람은 이런 게 있는지도 몰라.
    - 월 만원짜리를 두 달 반값으로 받으면 만원을 아끼는 거야. 매년 반복하면 실질 요금 자체가 달라지지.
    - 근데 여기서 생각해볼 게 있어. 반값에도 장사가 되면, 정가는 대체 뭘 기준으로 정한 걸까. 안 누르는 사람들이 그 차액을 메우고 있는 거야.
    - 진짜 해지할 생각이 없어도 마지막 단계까지 한 번 눌러봐. 제안이 없으면 그냥 나오면 돼. 3분이야.
  verdict: 해지 버튼을 끝까지 눌러본 사람이랑 아닌 사람이 다른 돈을 내.
  loop: 너 지금 내는 요금, 정가 그대로야?

030-card-annual-audit:
  hook: 연회비 12만원 내고, 혜택 얼마 받았는지 세봤어?
  stake: 만들 때는 다들 꼼꼼히 계산하는데, 1년 뒤엔 아무도 안 세거든.
  beats:
    - 카드 만들 땐 혜택표를 몇 번씩 봐. 그런데 1년 지나고 얼마 받았는지 세보는 사람은 거의 없어.
    - 연회비 12만원이면 혜택으로 12만원 넘게 받아야 본전이야. 라운지 두 번, 커피 할인 몇 건. 이걸로 채워졌는지 세보면 바로 나와.
    - 근데 함정은 여기야. 광고에 적힌 금액은 전부 최대로 썼을 때 기준이거든. 안 쓴 혜택은 그냥 0원이야.
    - 카드사 앱 들어가면 작년 할인이랑 적립 합계가 나와 있어. 그 숫자랑 연회비만 나란히 놓으면 끝이야.
  verdict: 혜택은 표에 적힌 최대치가 아니라 내가 실제로 쓴 만큼이야.
  loop: 작년에 라운지 몇 번 갔어?

031-fx-spread:
  hook: 환전 우대 90% 받았는데 왜 손해 본 느낌이지?
  stake: 90%가 뭘 깎아주는 건지 모르고 받는 사람이 대부분이야.
  beats:
    - 우대율은 환율을 깎는 게 아니야. 은행이 위에 얹는 수수료를 깎는 거야. 이거 하나만 알면 계산이 달라져.
    - 기준율이 1400원인데 현찰 살 때 1424원이면 수수료가 24원이잖아. 90% 우대면 2.4원만 내는 거지.
    - 그래서 100만원 바꾸면 21600원쯤 덜 내. 적은 돈은 아닌데, 90%라는 말에서 떠올린 금액이랑은 좀 다르지.
    - 은행마다 기본 수수료가 달라서, 우대 80%인 데가 최종 환율은 더 좋을 수도 있어. 그래서 받는 환율 숫자 하나로 비교해야 돼.
  verdict: 비교할 건 우대율이 아니라 내가 실제로 적용받는 환율이야.
  loop: 마지막 환전, 최종 환율 확인하고 했어?

032-dcc-trap:
  hook: 해외에서 원화로 결제했다가 5만원 더 냈어.
  stake: 계산대에서 원화를 누르는 그 순간에 수수료가 한 겹 더 붙거든.
  beats:
    - 해외에서 카드 긁으면 원화로 할지 현지 통화로 할지 물어봐. 원화가 편해 보이잖아. 그게 갈림길이야.
    - 현지 통화로 하면 카드사랑 브랜드 수수료만 붙어. 원화를 고르면 현지 가맹점이 자기 환율을 끼워 넣어서 한 겹이 더 얹혀.
    - 추가분을 5%로만 잡아도 100만원 결제에 5만원이야. 여행 한 번에 한 끼 값이 그냥 날아가는 거지.
    - 막는 법은 단순해. 화면에 원화랑 현지 통화가 같이 뜨면 무조건 현지 통화. 카드사에 따라 아예 차단 신청도 돼.
  verdict: 해외 결제는 항상 현지 통화야. 원화가 편한 만큼 비싸.
  loop: 지난 여행 영수증, 원화였어 현지 통화였어?

033-prepaid-membership:
  hook: 10회권 끊은 가게가 문 닫으면 그 돈은 어떻게 돼?
  stake: 할인만 보고 계산에서 통째로 빼놓는 항목이 하나 있어.
  beats:
    - 10회를 미리 끊으면 회당 단가가 내려가. 그래서 다들 선불을 고르지. 여기까지는 맞는 계산이야.
    - 근데 빠진 게 있어. 1년 안에 문 닫을 확률을 10%로 잡고 평균 다섯 회가 남는다고 치면, 기댓값으로 15000원을 잃는 거야. 할인받은 금액에서 이걸 빼야 진짜 이득이 나와.
    - 결제 방법에 따라 달라지기도 해. 20만원 넘는 걸 3개월 이상 할부로 긁었으면 할부항변권을 쓸 수 있는 경우가 있거든. 현금이나 일시불이면 그게 없어.
    - 회차를 줄이거나 할부로 긁어. 같은 할인 받으면서 위험만 줄이는 방법이야.
  verdict: 선불 할인은 공짜가 아니라 폐업 위험을 내가 떠안는 값이야.
  loop: 지금 남아 있는 회원권 몇 회야?

034-dashcam-battery:
  hook: 블랙박스 상시녹화, 배터리로 구독료 내는 거야.
  stake: 시동 꺼진 차에서 전기를 쓰는 건 배터리 하나뿐이거든.
  beats:
    - 주차 중에도 찍어주니까 대부분 켜두잖아. 근데 시동이 꺼진 차에서 전기를 빼 쓸 데는 배터리밖에 없어.
    - 교체 주기가 4년에서 2년 반으로 줄었다고 쳐봐. 20만원짜리를 1년 반 일찍 가는 거니까, 연 3만원짜리 옵션을 쓰고 있는 셈이야.
    - 저전압 차단 있으니까 괜찮다고들 하는데, 그건 방전을 막아주는 거야. 그 전까지 깊게 쓰는 것 자체가 수명을 깎는 거고.
    - 보조배터리를 달거나, 상시 말고 충격 감지만 켜두거나. 다 끄라는 얘기가 아니라 얼마짜린지 알고 켜자는 거야.
  verdict: 상시녹화는 공짜 기능이 아니라 배터리 수명으로 내는 구독료야.
  loop: 마지막으로 배터리 간 게 언제야?

035-fast-charge-resale:
  hook: 급속충전, 충전비만 보고 계산하면 반쪽이야.
  stake: 전기차는 배터리 상태가 중고가에 그대로 찍히거든.
  beats:
    - 급속은 빠르고 완속은 싸. 그래서 시간 없으면 급속. 여기까지는 누구나 하는 계산이야.
    - 빠진 항목이 잔가야. 급속 비중이 높으면 열화가 빨라지고, 중고 시세는 배터리 상태를 따로 봐.
    - 규모를 붙여보면 차이가 보여. 회당 차액 3천원에 연 100회면 30만원이야. 반면 잔가는 수백만원 단위로 움직여. 자릿수가 다르지.
    - 그렇다고 급속을 피하라는 게 아니야. 장거리는 써야지. 문제는 집에 완속이 있는데도 습관적으로 급속 가는 거야. 비율만 낮춰도 돼.
  verdict: 급속충전은 충전비가 아니라 중고가로 계산해야 돼.
  loop: 너는 급속이랑 완속, 비율이 어떻게 돼?

036-auto-wash-paint:
  hook: 자동세차 8천원, 도장값으로 계산하면 달라져.
  stake: 한 번에 티가 안 나니까 아무도 계산에 안 넣어.
  beats:
    - 자동세차가 싸고 빠른 데는 이유가 있어. 회전 브러시로 문지르거든. 미세한 스크래치가 조금씩 쌓여.
    - 한 번은 티가 안 나. 근데 주 1회면 3년에 150회야. 그쯤 되면 광택이 눈에 띄게 죽어.
    - 되돌리려면 부분 도색이나 광택 복원이 들어가. 패널당 수십만원이야. 어두운 색 차일수록 티가 더 크고.
    - 다 손세차 하라는 게 아니야. 평소엔 무브러시, 진짜 더러울 때만 브러시식. 이렇게 나누면 둘 다 지켜.
  verdict: 자동세차는 세차비가 아니라 도장 수명으로 계산해야 돼.
  loop: 너 차 색깔 뭐야? 어두운 색이면 한번 봐봐.

037-trunk-weight:
  hook: 트렁크에 실어둔 짐, 기름으로 치면 연 6만원이야.
  stake: 언젠가 쓸 것 같아서 둔 물건들이 매일 같이 달리고 있거든.
  beats:
    - 골프백, 캠핑의자, 생수 박스. 언젠가 쓸 것 같아서 실어둔 것들 있잖아. 그게 1년 내내 같이 달려.
    - 100kg 늘면 연비가 3%쯤 떨어진다고 알려져 있어. 연 15000km에 연비 12, 유가 1700원이면 연료비가 212만원. 3%면 6만원쯤이야.
    - 6만원이 큰돈은 아니지. 근데 트렁크 비우는 데 드는 비용이 0원이거든. 회수율 100%짜리가 몇 개 없어.
    - 덤도 있어. 무게가 줄면 제동거리도 짧아지고 타이어랑 브레이크 마모도 줄어. 돈으로 환산이 어려울 뿐 같은 방향이야.
  verdict: 트렁크 비우기는 비용이 0원인 유일한 연비 개선이야.
  loop: 지금 트렁크에 뭐 들어 있는지 기억나?

038-tire-pressure:
  hook: 공기압 부족은 손해를 두 번 내게 해.
  stake: 가만히 둬도 한 달에 조금씩 빠지는데 눈으로는 구별이 안 되거든.
  beats:
    - 타이어는 아무것도 안 해도 한 달에 조금씩 공기가 빠져. 근데 눈으로 봐서는 거의 티가 안 나.
    - 첫 번째 손해는 기름이야. 눌린 타이어는 접지면이 넓어져서 굴러가는 데 힘이 더 들어. 그만큼 기름을 더 써.
    - 두 번째가 더 커. 눌린 채로 달리면 양쪽 어깨만 먼저 닳아. 가운데는 멀쩡한데 갈아야 되는 거야. 4짝이면 수십만원이지.
    - 점검은 공짜야. 주유소나 정비소 게이지 대부분 무료고, 권장 수치는 운전석 문틀 스티커에 적혀 있어. 월 1회 3분이면 끝나.
  verdict: 공기압은 기름이랑 타이어를 동시에 깎아. 3분이면 둘 다 막아.
  loop: 마지막으로 공기압 본 게 언제야?

039-aircon-filter:
  hook: 에어컨 필터 안 갈면 전기요금으로 나와.
  stake: 서서히 막히니까 원인을 엉뚱한 데서 찾게 돼.
  beats:
    - 필터가 먼지로 막히면 공기가 덜 들어와. 같은 온도를 맞추려고 더 오래, 더 세게 돌아. 전기는 그만큼 더 쓰고.
    - 근데 체감이 안 돼. 어느 날 갑자기 뛰는 게 아니라 서서히 막히니까, 올해 유난히 더웠나 하고 넘어가는 거야.
    - 청소는 소모품을 사는 게 아니야. 먼지를 털어내는 일이라 0원이야. 뜯어서 물로 헹구고 말리면 끝, 10분이면 돼.
    - 덤도 있어. 막힌 필터가 곰팡이 냄새 원인이기도 하거든. 전기요금이랑 냄새를 같은 동작으로 잡는 거지.
  verdict: 필터 청소는 돈이 아니라 10분을 쓰는 일이야. 안 하면 매달 요금으로 내.
  loop: 올여름에 필터 한 번이라도 뜯어봤어?

040-power-tier:
  hook: 전기요금은 곱하기가 아니라 계단이야.
  stake: 평균 단가로 보면 이게 절대 안 보이거든.
  beats:
    - 전기요금은 쓴 만큼 곱하기가 아니야. 구간을 넘어가면 그 위부터 단가가 올라가. 마지막에 쓴 전기가 제일 비싼 거지.
    - 그래서 뭐가 달라지냐면, 경계에 걸쳐 있을 땐 조금만 줄여도 요금이 확 떨어져. 반대로 조금만 더 써도 확 올라가고.
    - 그럼 뭘 먼저 꺼야 하냐. 에어컨 참는 게 아니라 24시간 도는 걸 줄이는 쪽이 커. 셋톱박스, 대기전력, 오래된 냉장고 같은 것들.
    - 한전 앱이나 고지서에 이번 달 사용량이랑 지금 구간이 나와. 경계까지 몇 kWh 남았는지 보이면 행동이 달라져.
  verdict: 에어컨을 참기 전에 24시간 도는 것부터 확인해.
  loop: 너 지금 몇 단계인지 알아?

041-cloud-storage:
  hook: 사진 백업이 유료로 넘어가는 날, 이미 정해져 있어.
  stake: 켜두면 알아서 쌓이니까 차는 속도를 아무도 몰라.
  beats:
    - 사진 자동백업은 한 번 켜면 신경을 안 쓰잖아. 그래서 용량이 차는 속도도 모르는 거야.
    - 근데 계산이 돼. 15GB 중에 9GB를 썼고 월 0.5GB씩 늘면 12개월 뒤에 꽉 차. 그날부터 월 구독이 시작되는 거지.
    - 미리 알아야 하는 이유가 있어. 꽉 찬 날 갑자기 결제하면 그 순간엔 선택지가 없거든. 미리 알면 정리하거나 다른 걸 고를 여유가 생겨.
    - 용량 먹는 건 대개 정해져 있어. 원본 화질, 연사로 찍힌 비슷한 사진, 동영상, 메일 첨부. 이 넷만 손봐도 크게 줄어.
  verdict: 클라우드는 갑자기 유료가 되는 게 아니라 날짜가 정해져 있어.
  loop: 지금 용량 몇 퍼센트 찼어?

042-free-return-time:
  hook: 반품 무료니까 일단 주문한다는 말, 진짜 공짜일까?
  stake: 돈은 안 드는데 시간이 들어. 그리고 주문 자체가 늘어나.
  beats:
    - 반품이 무료면 고민하는 시간이 줄어들어. 아니면 보내면 되지가 되니까 주문 자체가 늘어나는 거야.
    - 근데 시간은 들어. 재포장하고 송장 붙이고 수거 기다리면 한 건에 25분. 월 4건이면 100분이고, 1년이면 20시간이야.
    - 더 큰 게 따로 있어. 일단 주문이 늘면 반품 안 하고 그냥 쓰게 되는 것도 같이 늘거든. 그게 제일 비싼 항목이야.
    - 사이즈처럼 실물 봐야 아는 건 그냥 써. 괜찮으면 쓰지 하는 주문에만 안 쓰면 돼. 기능은 두고 기준만 정하는 거야.
  verdict: 무료 반품은 돈이 아니라 시간이랑 결제 습관으로 내는 거야.
  loop: 지난달에 반품 몇 건 했어?

# ── 기존 편 대본 보강 (003~026) ──
# 화면 문구를 읽던 편들을 말로 바꾼 것. 숫자는 화면이 보여주고
# 목소리는 '왜 그 숫자가 중요한지'를 말한다.

003-gym-annual:
  hook: 헬스장 1년권은 안 나올 사람을 전제로 만든 가격이야.
  stake: 결제하는 순간 통계에 베팅하는 거거든.
  beats:
    - 1년권이 싼 데는 이유가 있어. 전원이 매일 나오면 그 가격이 성립을 안 하거든. 안 나올 사람을 깔고 짠 가격인 거야.
    - 계산은 하나만 하면 돼. 1년권 값을 실제 출석 횟수로 나눠봐. 주 1회만 가면 1회 이용료가 PT 체험가랑 비슷해져.
    - 1년권이 월권 여덟 달치면 여덟 달은 꾸준히 다녀야 본전이야. 지금까지 석 달 넘겨본 적이 없다면 월권이 맞고.
    - 더 싼 데도 있어. 지자체 공공체육시설, 회사 복지포인트, 국민체력100 연계. 광고를 안 해서 모를 뿐이야.
  verdict: 석 달을 먼저 넘겨보고 끊어도 안 늦어.
  loop: 너는 지금까지 제일 오래 다닌 게 몇 달이야?

006-car-tco:
  hook: 차값보다 5년 유지비가 더 나올 수도 있어.
  stake: 할부금만 보면 뭐든 감당 가능해 보이거든.
  beats:
    - 차 살 때 보는 숫자는 절반짜리야. 취득세, 보험, 자동차세, 기름값, 소모품, 주차비에 감가까지 더해야 진짜 가격이 나와.
    - 그중에 제일 큰 게 감가야. 눈에 안 보이는데 금액은 제일 커. 5년 뒤 중고 시세를 미리 찾아보면 숫자로 보여.
    - 5년치 총액을 60개월로 나눠봐. 그 숫자를 월급 옆에 놔야 감당이 되는지 판단이 돼.
    - 차가 돈값하는 조건은 둘이야. 출퇴근이 왕복 두 시간 넘거나, 차가 있어야 벌리는 돈이 있거나. 주말에만 쓰면 렌트나 카셰어링이 거의 항상 싸.
  verdict: 매일 타면 사도 돼. 주말에만 탈 거면 감가를 매달 사는 거야.
  loop: 너는 일주일에 며칠이나 타?

009-certificate:
  hook: 자격증 따기 전에 5분만 확인하면 돼.
  stake: 수당으로 안 돌아오면 투자가 아니라 취미거든.
  beats:
    - 자격증은 세 종류야. 수당이 붙는 것, 없으면 지원 자체가 안 되는 것, 그리고 아무 영향 없는 것. 세 번째에 돈 쓰는 경우가 생각보다 많아.
    - 학원비랑 응시료, 교재비를 다 더해서 월 수당으로 나눠봐. 회수에 24개월 넘게 걸리면 투자보다는 취미 쪽이야.
    - 근데 제일 비싼 건 학원비가 아니야. 시간이야. 준비 100시간짜리면 내 시급 곱하기 100시간이 진짜 원가지.
    - 먼저 할 건 두 개야. 회사 취업규칙에서 자격 수당 항목 찾아보기, 채용공고에 그 자격이 실제로 적혀 있는지 검색해보기. 5분이면 끝나.
  verdict: 수당이나 지원 자격에 연결되면 따고, 연결고리가 없으면 하지 마.
  loop: 너희 회사 자격 수당 항목, 본 적 있어?

010-coffee:
  hook: 커피 한 잔 값은 판단에 쓰기엔 너무 작아.
  stake: 뇌가 이 정도쯤이야로 처리해버리거든.
  beats:
    - 한 잔 가격으로는 판단이 안 돼. 너무 작아서 그냥 넘어가버리거든. 연으로 환산해야 다른 지출이랑 비교가 돼.
    - 한 잔 값에 주 5일, 52주를 곱해봐. 그 금액을 여행이나 가전, 저축 옆에 놓고 봐야 진짜 비교지.
    - 홈카페가 무조건 싼 것도 아니야. 원두에 기기 감가에 준비 시간까지 들어. 매일 아침 15분이면 1년에 60시간이야.
    - 그래서 답은 끊기가 아니라 빈도야. 주 5회를 주 2회로만 바꿔도 연간 금액이 절반 아래로 떨어져.
  verdict: 끊을 필요는 없어. 빈도만 줄여도 절반이야.
  loop: 너는 일주일에 몇 잔 마셔?

011-ai-subscription:
  hook: 무료로도 되는데 굳이 돈 내는 이유가 뭘까?
  stake: 기능 개수가 아니라 무료로 막히는 횟수가 값을 정해.
  beats:
    - 유료의 값어치는 기능이 몇 개냐가 아니야. 무료로 쓰다가 막히는 순간이 한 달에 몇 번이냐야. 그걸 먼저 세봐야 해.
    - 월 구독료를 본인 시급으로 나눠봐. 몇 시간을 아껴야 본전인지 나와. 그 숫자가 한 자리면 대체로 이득이고.
    - 근데 함정이 있어. 세 개를 같이 구독하면 각각 쓰는 빈도가 쪼개져. 결제는 세 배인데 활용은 1.3배쯤 되는 구간이 생겨.
    - 글을 매일 쓰거나 코드를 짜거나 자료 정리가 일인 사람은 무조건 이득이야. 가끔 검색 대용으로만 쓰면 무료로 충분하고.
  verdict: 하나를 깊게 쓰는 게 답이야. 세 개 동시 결제는 결제만 세 배야.
  loop: 너는 지금 몇 개 결제 중이야?

012-youtube-premium:
  hook: 프리미엄 14900원, 광고값이 아니라 시간값이야.
  stake: 본인 시급이랑 나란히 놓아야 답이 나와.
  beats:
    - 광고 하나 15초, 하루 20개면 5분이야. 한 달이면 두 시간 반이고. 14900원을 그 시간으로 나누면 시간당 6천원쯤이지.
    - 근데 진짜 값어치는 광고가 아니라 백그라운드 재생일 수도 있어. 음악 구독을 대체하면 두 개 값을 하나로 합치는 거니까.
    - 반대로 하루 30분 이하로 보면 광고 노출 자체가 적어. 그 경우엔 그냥 광고 보는 게 싸.
    - 가족 요금제도 변수야. 혼자 쓰면 비싸도 나눠 쓰면 1인당 부담이 확 떨어지거든.
  verdict: 하루 한 시간 넘게 보고 백그라운드까지 쓰면 유지, 30분 이하면 해지야.
  loop: 너 하루에 유튜브 얼마나 봐?

013-airpods-vs-cheap:
  hook: 이어폰 30만원, 음질 차이는 생각보다 작아.
  stake: 가격 차이의 대부분은 음질에서 오는 게 아니거든.
  beats:
    - 블라인드로 들려주면 대부분 구분을 못 해. 가격 차이가 음질에서 오는 게 아니라는 얘기야.
    - 진짜 차이는 노이즈캔슬링이야. 지하철이나 카페에서 쓰는 시간이 길수록 체감이 커. 조용한 집에서만 쓰면 그 기능값은 버리는 돈이고.
    - 하루 사용 시간으로 나눠봐. 출퇴근 왕복 두 시간씩 3년이면 2190시간이야. 시간당 160원이니까 계산상으로는 작아.
    - 근데 배터리가 변수야. 무선 이어폰은 배터리가 소모품이라 2~3년이면 사용 시간이 확 줄어. 비쌀수록 이 감가를 계산에 넣어야 해.
  verdict: 시끄러운 데서 하루 한 시간 넘게 쓰면 사고, 조용한 집에서만 쓰면 5만원대로 충분해.
  loop: 너는 주로 어디서 껴?

014-delivery-vs-pickup:
  hook: 같은 치킨인데 배달이랑 포장 값이 왜 다를까?
  stake: 배달비를 0원으로 만들어도 차액이 남거든.
  beats:
    - 배달앱은 수수료가 붙는 만큼 메뉴 가격 자체가 매장보다 높은 경우가 많아. 그래서 배달비를 없애도 차액이 남는 거야.
    - 무료배달도 마찬가지야. 그 비용이 사라진 게 아니라 음식값이나 최소 주문 금액으로 옮겨간 거지.
    - 그렇다고 포장이 공짜는 아니야. 왕복 이동 시간이랑 기름값이 들어. 도보 5분이면 포장이 압도적인데, 차로 15분이면 뒤집힐 수 있어.
    - 제일 크게 새는 건 따로 있어. 최소 주문 금액 맞추려고 안 시킬 메뉴 담는 거. 배달비 아끼려다 더 쓰는 전형이야.
  verdict: 도보권이면 포장이야. 배달의 값어치는 음식이 아니라 안 나가도 되는 시간에 있어.
  loop: 마지막 주문 때 최소 금액 맞추려고 뭐 더 담았어?

015-card-annual-fee:
  hook: 연회비 본전은 할인율이 아니라 한도가 정해.
  stake: 10% 할인이어도 월 한도가 낮으면 그 위로는 0원이거든.
  beats:
    - 본전을 정하는 건 할인율이 아니라 월 최대 할인 한도야. 10%여도 한도가 낮으면 그 위로는 아무것도 안 나와.
    - 전월 실적 조건도 봐야 해. 그 금액 채우려고 쓰는 돈이 있으면 그건 할인이 아니라 그냥 지출이야.
    - 계산은 한 줄이야. 연회비를 12로 나눈 금액을, 실적 조건 안에서 매달 확실히 채울 수 있어야 본전이지.
    - 흔한 착각이 하나 있어. 혜택 항목 많은 카드가 좋아 보이는데, 실제로는 내가 매달 가는 한두 곳에서만 할인이 나와. 나머지는 빼고 계산하는 게 정확해.
  verdict: 고정 지출이 명확하면 연회비 카드, 소비가 들쭉날쭉하면 연회비 없는 카드야.
  loop: 너 전월 실적 채우려고 뭐 산 적 있어?

016-office-chair:
  hook: 의자에 100만원? 근데 하루 여덟 시간 앉잖아.
  stake: 시간당 비용으로 보면 순위가 완전히 바뀌거든.
  beats:
    - 옷은 하루 몇 시간 입고 신발은 몇 시간 신어? 의자는 여덟 시간 넘게 몸에 닿아. 시간당으로 보면 순위가 완전히 달라져.
    - 가격을 하루 사용 시간 곱하기 365, 곱하기 쓸 연수로 나눠봐. 5년 쓴다고 치면 열 배 가격차가 시간당으로는 아주 작아져.
    - 비싼 값의 정체는 내구성이야. 저가는 쿠션이 주저앉고 부품이 헐거워지는 시점이 빨리 와. 2년마다 갈면 총액이 금방 따라붙어.
    - 그렇다고 100만원이 상한은 아니야. 가격이랑 편안함이 비례하는 구간은 어디선가 끝나. 그 위는 브랜드랑 디자인 값이고.
  verdict: 최저가도 최고가도 답이 아니야. 중간 가격대에서 체형에 맞는 걸 골라.
  loop: 너 지금 앉은 의자, 몇 년 됐어?

017-premium-gas:
  hook: 고급유 넣으면 차가 진짜 좋아질까?
  stake: 답은 취급설명서에 이미 적혀 있어.
  beats:
    - 제조사가 권장하는 연료 등급이 취급설명서에 적혀 있어. 일반유 권장 차에 고급유를 넣는다고 성능이 올라가지는 않아.
    - 부드러워졌다고 느끼는 경우가 많은데, 주유 직후엔 운전 습관도 같이 달라지거든. 같은 조건으로 반복해보지 않으면 구분이 어려워.
    - 리터당 차액에 월 주유량, 곱하기 12. 연간 총액으로 바꿔봐. 그 돈을 정비나 타이어에 쓰는 게 체감이 큰 경우가 많아.
    - 같은 예산이면 엔진오일 주기, 타이어 공기압, 불필요한 짐 빼기. 이 셋이 연비랑 승차감에 훨씬 확실하게 작용해.
  verdict: 일반유 권장 차량이면 같은 돈을 엔진오일이랑 타이어로 돌려.
  loop: 너 차 권장 등급이 뭔지 알아?

018-mvno-vs-5g:
  hook: 휴대폰 요금 9만원. 3개월 사용량 본 적 있어?
  stake: 대부분 자기가 생각하는 것보다 훨씬 적게 써.
  beats:
    - 휴대폰 설정에서 최근 3개월 데이터 사용량을 볼 수 있어. 대부분 자기가 생각하는 것보다 훨씬 적게 써.
    - 집이랑 회사에서 와이파이를 쓰면 실제 셀룰러는 이동 중으로 한정돼. 하루 왕복 두 시간이면 필요한 데이터가 확 줄어.
    - 차액을 연으로 바꾸면 34만원이 넘어. 근데 여기서 끝내면 계산이 틀어져.
    - 알뜰폰 광고 가격은 대부분 첫 12개월 한정이거든. 13개월째 요금까지 넣고 2년 총액으로 비교해야 진짜 순위가 나와. 고객센터랑 결합할인이 약한 것도 감안해야 하고.
  verdict: 3개월 사용량 본 적 없으면 바꾸는 게 맞아. 단, 가족 결합 할인이 크면 그대로 둬.
  loop: 너 지난달에 데이터 몇 기가 썼어?

019-dryer:
  hook: 건조기는 빨래 가전이 아니라 시간 가전이야.
  stake: 그렇게 보면 계산식 자체가 달라지거든.
  beats:
    - 널고 걷는 시간을 주 단위로 세보면 답이 빨리 나와. 거기에 본인 시급을 곱한 게 실제로 아끼는 값이야.
    - 공간값도 넣어야 해. 건조대 자리랑 실내 건조 습기, 냄새가 같이 사라져. 집이 좁을수록 이 값이 커지고.
    - 대신 비용도 있어. 고온 건조는 일부 소재를 상하게 해. 아끼는 옷이 많으면 그건 따로 널어야 하니까 절약 효과가 줄어.
    - 주 1회 몰아서 빨고 베란다가 넓으면 아끼는 시간 자체가 작아. 그럼 회수 기간이 길어져.
  verdict: 주 2회 이상 빨래하면 사. 주 1회에 베란다 넓으면 안 사도 돼.
  loop: 너는 일주일에 빨래 몇 번 해?

020-starbucks-vs-mega:
  hook: 커피에 내는 걸까, 자리에 내는 걸까?
  stake: 이 둘은 완전히 다른 소비야. 섞으면 계산이 안 돼.
  beats:
    - 테이크아웃해서 바로 마시면 사는 건 커피야. 앉아서 두 시간 있으면 사는 건 자리고. 완전히 다른 소비지.
    - 차액을 체류 시간으로 나눠봐. 시간당 얼마짜리 공간을 쓰는지 나와. 스터디카페나 공유오피스랑 비교하면 오히려 싼 경우도 많아.
    - 반대로 들고 나가서 30분 안에 마실 거면, 브랜드 차액은 순수하게 맛이랑 이미지 값이야. 이건 취향이라 본전 계산이 안 돼.
    - 근데 진짜 새는 건 빈도야. 잔당 차액보다 하루 몇 잔이냐가 연간 총액을 정해. 하루 두 잔이면 브랜드 바꾸는 것보다 한 잔 줄이는 게 훨씬 커.
  verdict: 앉아서 한 시간 넘게 있으면 브랜드 카페, 테이크아웃 전용이면 저가 커피야.
  loop: 너는 앉아서 마셔, 들고 나가?

021-ott-bundle:
  hook: 천원 더 내면 OTT가 하나 더 생긴다는데.
  stake: 서비스는 늘어나는데 볼 시간은 안 늘어나거든.
  beats:
    - 같은 돈이면 하나보다 둘이 낫지 않나. 이 질문이 실제로 성립하는 가격대가 있어.
    - 따로 결제하면 티빙 13500에 디즈니플러스 9900, 합쳐서 23400원이야. 번들은 18000원이고. 매달 5400원, 1년이면 64800원 차이야.
    - 그래서 천원 더 내고 하나 더 생기는 건 맞아. 근데 보는 시간은 두 배가 안 돼. 시간은 그대론데 결제만 느는 게 구독의 기본 함정이야.
    - 판단 기준은 하나야. 지난 한 달에 각 서비스에서 끝까지 본 작품이 몇 개냐. 하나 이하면 구독이 아니라 기부에 가까워.
  verdict: 둘 다 볼 시간이 있으면 번들이 확실히 유리해. 시간이 없으면 하나 끊는 쪽이 훨씬 커.
  loop: 지난달에 끝까지 본 거 몇 편이야?

022-aircon-90min:
  hook: 에어컨 껐다 켜기, 기준선이 정확히 있어.
  stake: 90분. 이거 하나로 갈려.
  beats:
    - 삼성전자 실험 기준으로 30분 나갔다 오면 전력이 5% 늘고, 60분은 2% 늘었어. 90분을 넘겨야 끄는 쪽이 이기는 거야.
    - 단 이건 인버터 얘기야. 정속형은 설정 온도에 도달한 다음 두 시간쯤 꺼두는 편이 나아. 오래된 모델이면 먼저 확인해야 해.
    - 제습이 더 싸다는 말도 있잖아. 한국소비자원 시험에서 24도 냉방이 1.782, 같은 온도 제습이 1.878이었어. 오히려 제습이 조금 더 썼어.
    - 근데 진짜 큰 변수는 따로 있어. 껐다 켜기 고민할 시간에 설정 온도를 2도 올리는 게 훨씬 크게 작용해.
  verdict: 한 시간 반. 그보다 짧게 나가면 켜두고, 길면 꺼.
  loop: 너는 지금 몇 도로 맞춰놨어?

023-card-golden-ratio:
  hook: 같은 돈을 써도 순서만 바꾸면 공제액이 달라져.
  stake: 문턱 아래 구간은 아무리 써도 0원이거든.
  beats:
    - 카드 공제는 총급여의 25%를 넘겨야 시작돼. 그 아래는 아무리 써도 공제액이 0원이야.
    - 그래서 순서가 생겨. 문턱까지는 어차피 0이니까 혜택 좋은 신용카드로 채우고, 넘긴 다음부터 체크카드나 현금영수증으로 갈아타는 거지.
    - 공제율이 두 배 차이야. 신용카드가 15%, 체크카드랑 현금영수증이 30%. 전통시장이랑 대중교통은 40%고.
    - 대신 한도가 있어. 총급여 7천만원 이하면 300만원. 채우고 나면 더 써도 돌아오는 게 없어. 그때부턴 안 쓰는 게 이득이야.
  verdict: 25%까지는 신용카드, 그 위부터는 체크카드. 순서만 바꿔도 커져.
  loop: 너 올해 25% 넘겼는지 알아?

024-choice-discount:
  hook: 선택약정이냐 지원금이냐, 한 줄이면 끝나.
  stake: 월 요금제에 25%, 24개월. 이게 전부야.
  beats:
    - 계산은 한 줄이야. 월 요금제에 25% 곱하고 24개월 곱해봐. 이 숫자보다 지원금이 작으면 선택약정이 이겨.
    - 그래서 요금제가 높을수록 선택약정이야. 7만원 넘으면 2년 할인액이 40만원을 넘어. 반대로 3만원대나 5만원대면 지원금이 유리한 경우가 많고.
    - 2025년 7월에 단통법이 폐지됐어. 지원금 상한이 사라져서 판매처마다 금액이 크게 달라져. 이제는 어디서 사느냐까지 계산에 들어가.
    - 선택약정은 기기를 어디서 샀든 신청할 수 있어. 약정 끝난 폰 그대로 쓰면서 25% 할인만 다시 거는 것도 되고.
  verdict: 월 7만원 넘게 쓰면 선택약정이 거의 항상 이겨. 5초면 확인돼.
  loop: 너 지금 뭘로 걸려 있는지 알아?

025-mileage-rider:
  hook: 계기판 사진 한 장이 10만원 단위야.
  stake: 특약을 걸어놔도 인증을 안 하면 못 받거든.
  beats:
    - 연 1만킬로 이하면 5에서 10%, 5천킬로 이하면 15에서 20%까지 보험료가 내려가. 회사마다 구간이랑 비율은 조금씩 달라.
    - 핵심은 인증이야. 특약을 걸어놨어도 만기 전에 주행거리를 인증 안 하면 못 받아. 계기판 사진 한 장이면 되는데 이걸 안 해서 놓쳐.
    - 안 내면 중립도 아니야. 인증 기간에 제출을 안 하면 특약이 해지되고, 이미 받은 할인액을 다시 물어야 할 수도 있어.
    - 생각보다 해당되는 사람 많아. 출퇴근 대중교통으로 하고 주말에만 타면 연 5천킬로 넘기기가 어렵거든. 계기판만 보면 5초에 확인돼.
  verdict: 적게 타면서 이 특약이 없으면 매년 그냥 더 내는 중이야.
  loop: 지금 계기판 숫자 기억나?

026-energy-cashback:
  hook: 이미 아끼고 있는데 신청만 안 한 집이 제일 손해야.
  stake: 신청을 안 하면 아무리 아껴도 0원이거든.
  beats:
    - 과거 평균보다 전기를 1%만 덜 써도 kWh당 30원을 돌려줘. 10% 줄이면 100원, 20에서 30%면 120원까지 올라가.
    - 숫자로 보면 400을 360으로 줄였을 때 40kWh, 곱하기 100원이면 4천원이야. 큰돈은 아닌데 아무것도 더 안 하고 받는 돈이지.
    - 신청은 한전ON이나 슬기로운 전기생활 앱에서 해. 연중 상시 접수고 한 번 가입하면 재신청도 필요 없어. 이사 가면 다시 해야 하고.
    - 왜 다들 모르냐면 홍보가 거의 없어. 그래서 이미 전기 줄이고 있는 집이 신청만 안 해서 놓치는 경우가 제일 많아.
  verdict: 절약을 새로 시작할 필요도 없어. 신청 안 한 만큼이 그냥 날아가는 중이야.
  loop: 너희 집 이거 신청돼 있어?

# ── GPT 분기점 트랙 12편 (threshold-v2) ──
# codex 슬라이드는 6장 고정이라 beats 는 3개다.
#   슬라이드0=hook+stake / 1~3=beats / 4=verdict / 5=loop

cx006-vacation-app:
  hook: 항공권 3만원 아끼려다 12만원 날릴 수도 있어.
  stake: 얼리버드가 싼 게 아니라 일정을 고정하는 대가거든.
  beats:
    - 환불불가가 12만원, 변경가능이 15만원이라고 쳐. 지금 아끼는 건 딱 3만원이야.
    - 근데 취소하면 12만원이 날아가. 3만원을 12만원으로 나눠봐. 25%야.
    - 이게 분기점이야. 일정이 바뀔 확률을 25%보다 높게 보면 변경가능 쪽이 기대비용이 더 낮아.
  verdict: 확률을 10%로 보면 예상 손실이 1만2천원이야. 그럼 3만원 더 내는 게 손해지.
  loop: 너는 휴가 일정 바뀐 적 몇 번이야?

cx101-installment-cash:
  hook: 무이자 할부가 항상 이기는 건 아니야.
  stake: 일시불 할인율이 얼마냐에 따라 그냥 뒤집히거든.
  beats:
    - 100만원짜리를 일시불로 사면 3% 할인, 그러니까 3만원을 바로 아껴.
    - 반대로 무이자 할부면 그 100만원이 손에 남잖아. 1년 동안 그 돈으로 얼마를 버느냐가 문제야.
    - 세후 이자에 카드 혜택까지 다 더해서 3만원을 넘으면 할부가 이기고, 못 넘으면 일시불이 이겨.
  verdict: 2만원밖에 못 벌면 일시불이야. 즉시 할인보다 1만원 부족한 거니까.
  loop: 너 무이자 걸면 적립 빠지는지 확인해봤어?


cx103-taxi-transit:
  hook: 셋이 타면 택시가 사치가 아닐 수도 있어.
  stake: 혼자 탈 때 기준으로만 생각하니까 안 보이는 거야.
  beats:
    - 택시비가 1만8천원이라고 쳐. 셋이 나눠 타면 한 명당 6천원이야.
    - 대중교통은 2천원인데, 더 걸리는 시간을 4천원어치로 치면 체감으로 6천원이 돼.
    - 여기서 딱 같아져. 세 명이 분기점인 거야.
  verdict: 둘이면 택시가 한 명당 9천원이라 대중교통이 이겨. 인원 하나에 답이 바뀌어.
  loop: 너는 몇 명부터 택시 타?

cx104-self-full-gas:
  hook: 셀프주유로 아낀 돈, 40리터는 넣어야 남아.
  stake: 리터당 차액이 작아서 다들 총액으로 안 보거든.
  beats:
    - 리터당 30원 싸다고 치고 40리터를 넣으면 1200원을 아껴.
    - 근데 셀프는 내가 5분을 더 써. 시급을 만4천4백원으로 잡으면 그 5분이 딱 1200원이야.
    - 40리터에서 돈이랑 시간이 정확히 같아져. 여기가 분기점이야.
  verdict: 20리터만 넣으면 600원 아끼려고 5분을 쓰는 거라 일반주유가 나아.
  loop: 너는 보통 몇 리터씩 넣어?

cx105-daily-monthly-lens:
  hook: 렌즈는 한 달에 12일 쓰냐로 갈려.
  stake: 한달용이 싸다는 계산은 매일 쓴다는 전제 위에 서 있거든.
  beats:
    - 원데이를 양쪽 합쳐 하루 2천원으로 보면, 12일 쓰면 2만4천원이야.
    - 한달용은 렌즈에 세정액까지 합쳐서 한 달에 2만4천원쯤 들어. 며칠 쓰든 이 값은 그대로고.
    - 그래서 12일에서 정확히 만나. 이걸 넘으면 한달용, 못 넘으면 원데이야.
  verdict: 한 달에 8일만 끼면 원데이는 1만6천원이야. 가끔 쓰면 원데이가 이겨.
  loop: 너는 한 달에 며칠 껴?

cx106-refurb-new:
  hook: 리퍼는 최소 20%는 싸야 고민할 이유가 생겨.
  stake: 싸다는 것만 보고 보증을 안 보면 계산이 반쪽이야.
  beats:
    - 신품이 100만원, 리퍼가 80만원이라고 쳐. 차액이 20만원이야.
    - 이게 정확히 20%야. 같은 모델 기준으로 얼마나 깎인 건지부터 봐야 해.
    - 보증이 신품이랑 똑같이 12개월이면, 20% 할인은 꽤 매력적인 거야.
  verdict: 근데 보증이 3개월로 줄면 얘기가 달라져. 고장 위험을 내가 더 떠안는 거니까.
  loop: 너 리퍼 사본 적 있어? 보증 얼마였어?

cx107-filter-service:
  hook: 정수기 방문관리비, 한 번에 얼마인지 세본 적 있어?
  stake: 필터값이랑 사람 오는 값이 한 덩어리로 묶여 있거든.
  beats:
    - 방문관리를 붙이면 1년에 4만8천원이 더 나간다고 쳐.
    - 방문 한 번의 가치를 1만2천원으로 보면, 연 4회에서 딱 4만8천원이 돼.
    - 여기가 분기점이야. 네 번이 필요하면 본전이고, 그보다 적으면 더 내는 거지.
  verdict: 연 2회면 체감 가치가 2만4천원이야. 그럼 자가교체가 이겨.
  loop: 너희 집 정수기, 1년에 몇 번 와?

cx108-subscribe-ondemand:
  hook: 정기배송 할인, 다 못 쓰면 할인이 아니야.
  stake: 배송 주기랑 내가 쓰는 속도가 다르면 그냥 쌓이기만 해.
  beats:
    - 30일마다 오는데 실제로는 40일 걸려서 쓴다고 해봐.
    - 1년에 열두 번 오는데 실제 소비는 아홉 번치야. 세 개가 남는 거지.
    - 그래서 소비 주기 30일이 분기점이야. 30일 안에 다 쓰면 정기배송이랑 맞아떨어져.
  verdict: 40일이면 1년에 세 개가 재고로 쌓여. 할인보다 선결제가 커질 수 있어.
  loop: 너 마지막 배송분, 다 쓰고 다음 게 왔어?

cx109-printer-tank:
  hook: 프린터는 500장을 넘겨야 비싼 게 싸져.
  stake: 본체값만 보면 답이 반대로 나와.
  beats:
    - 본체 가격 차이가 10만원이라고 쳐. 여기까지는 싼 쪽이 이겨.
    - 근데 한 장 뽑는 데 드는 돈이 200원 차이야. 이게 뽑을 때마다 붙어.
    - 10만원을 200원으로 나누면 500장이야. 여기서 뒤집히는 거지.
  verdict: 1년에 200장만 뽑으면 유지비 차이가 4만원이라 저가 본체가 나아.
  loop: 너희 집 1년에 몇 장쯤 뽑아?

cx110-bulk-small:
  hook: 30% 싸게 샀어도 70%를 못 쓰면 안 싼 거야.
  stake: 대용량 단가는 다 쓴다는 가정 위에 서 있거든.
  beats:
    - 소용량으로 사면 100, 대용량으로 사면 70이라고 쳐. 30% 싼 거야.
    - 근데 30%를 남기면 실제로 쓴 양도 70이야. 70 나누기 70이면 단가가 똑같아져.
    - 그래서 70%가 정확한 분기점이야. 이보다 많이 써야 진짜 싸지는 거지.
