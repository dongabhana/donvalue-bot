# 편별 나레이션 대본 — 영상에서 '말로 하는' 내용
#
# ■ 제일 중요한 원칙: 화면 글자를 읽지 않는다
#   화면은 숫자와 결론을 '보여주고', 목소리는 그 숫자가 왜 중요한지를 '말한다'.
#   둘이 같은 말을 하면 보는 사람은 둘 다 안 듣는다.
#
# ■ 말투
#   반말 구어체. "~야, ~거든, ~잖아". 문어체("~이다", "~합니다")는 쓰지 않는다.
#   인스타 캡션은 해요체 그대로 두고 영상 목소리만 반말이다.
#
# ■ 훅 (hook)
#   첫 1.5초에 승부가 난다. 규칙 세 개.
#     1) 첫 단어에 제품명 또는 금액이 나온다
#     2) 손해·반전을 먼저 말한다. 설명은 그 다음
#     3) 20자 안팎. 길면 훅이 아니라 설명이다
#
# ■ 리듬
#   짧은 문장으로 끊는다. 중간에 "근데 진짜 함정은 여기" 같은 전환 한 마디를
#   넣어 귀를 다시 잡는다. 숫자는 한 문장에 하나만.
#
# ■ 칸 설명
#   hook     표지 장면. 제일 중요
#   stake    왜 이게 문제인지 한 줄
#   beats    본문 카드 순서 그대로. 카드가 빠져도 나머지는 자기 대사를 유지
#   verdict  결론. 단정형으로 끝낸다
#   loop     마지막 참여 유도. 질문으로 끝낸다
#
# 대본이 없는 편은 화면 문구를 그대로 읽는다(딱딱하다). 새 편을 낼 때
# 여기에 대본을 추가하면 그때부터 제대로 말한다.

001-coupang-wow:
  hook: 쿠팡 와우 월 7890원, 본전 뽑는 사람 생각보다 적어.
  stake: 혜택 목록부터 보면 무조건 이득처럼 보이거든? 그게 함정이야.
  beats:
    - 계산은 하나만 하면 돼. 무료배송 몇 번 썼냐, 곱하기 배송비. OTT니 반품이니는 전부 덤으로 쳐.
    - 비회원은 19800원 안 되면 배송비가 붙어. 그런 주문이 한 달에 세 번이면 본전, 두 번이면 손해야.
    - 근데 진짜 함정은 여기. 무료배송이라고 원래 안 살 걸 담기 시작하면, 아낀 배송비보다 더 나가. 구독료가 문제가 아니라 습관이 문제인 거지.
    - 혼자 살면서 생필품 찔끔찔끔 시키면 무조건 남아. 반대로 한 달에 한두 번 몰아 사는 집은 그냥 돈 버리는 거고.
  verdict: 지난달 무료배송 세 번 넘게 썼으면 유지, 아니면 해지가 답이야.
  loop: 주문 내역 한 번만 세봐. 너는 몇 번이었어?

002-water-purifier:
  hook: 정수기 월 26900원. 이거 본전 뽑으려면 하루에 물 몇 리터 마셔야 할까?
  stake: 렌탈은 월 얼마, 생수는 묶음 얼마. 단위가 다르니까 비교가 안 되는 거야.
  beats:
    - 질문을 바꾸면 바로 나와. 렌탈료를 생수 한 병 값으로 나눠봐. 하루 몇 리터를 마셔야 본전인지가 딱 떨어져.
    - 브랜드 생수 1200원짜리로 나누면 스물두 병. 하루 1.5리터야. 성인 권장량이 2리터쯤이니까 혼자 살아도 넘기는 양이지.
    - 근데 최저가 500원짜리로 바꿔보면? 쉰네 병, 하루 3.6리터. 1인 가구가 이걸 마시긴 어렵잖아. 이 경우엔 생수가 이겨.
    - 그래서 갈림길은 딱 하나야. 무슨 물을 마시냐. 가족 수가 늘면 둘 다 정수기 쪽으로 기울고.
  verdict: 브랜드 생수 마시면 정수기가 이득, 최저가로 충분하면 생수가 이득이야.
  loop: 너는 지금 어떤 물 마셔?

004-ott-stack:
  hook: OTT 네 개 구독 중인데, 시간당 얼마 내는지 세본 적 있어?
  stake: 요금은 다 비슷해. 갈리는 건 본 시간이야.
  beats:
    - 둘 다 월 만원이라고 쳐. A는 스무 시간 봤고 B는 두 시간 봤어. 같은 돈인데 단가는 같을까?
    - A는 시간당 500원, B는 5000원. 열 배 차이야. 요금제를 바꾼 게 아니라 그냥 안 본 것뿐인데.
    - 그렇다고 단가 낮다고 무조건 해지하란 건 아니야. 기다리는 작품이 있으면 그건 그것대로 값을 하거든.
    - 지난달에 한 번도 안 켠 거 하나만 골라봐. 해지하고 보고 싶어질 때 다시 붙이면 돼.
  verdict: 요금표 말고 지난달 시청 시간부터 봐. 거기 답이 다 있어.
  loop: 네 개 중에 안 본 거, 몇 개야?

005-mvno:
  hook: 알뜰폰 월 12000원 싸다길래 갈아탔는데, 1년 지나니까 남은 게 24000원이었어.
  stake: 첫 달 광고 요금만 보면 무조건 이득처럼 보이거든.
  beats:
    - 지금 31000원 내고 있고, 새 요금은 첫 6개월 19000원, 그 뒤로 39000원이라고 쳐.
    - 첫 6개월은 매달 12000원씩 아껴. 합치면 72000원. 여기까지만 보면 개이득이지.
    - 근데 다음 6개월은 반대로 매달 8000원씩 더 내. 48000원. 1년 합치면 남은 건 24000원, 저녁 한 끼야.
    - 여기에 위약금이랑 결합할인 빠지는 것까지 더하면 마이너스 나는 집도 있어.
  verdict: 첫 달 말고 할인 끝난 뒤 요금으로, 12개월 총액을 비교해.
  loop: 너 지금 요금제, 할인 끝난 금액 알고 있어?

007-dishwasher:
  hook: 식기세척기 80만원. 비싸 보이는데, 하루로 나누면 731원이야.
  stake: 기계값만 보면 비싸고, 내 시간을 넣으면 얘기가 달라져.
  beats:
    - 구매랑 설치까지 80만원이라고 쳐. 중요한 건 가격이 아니라 3년 동안 몇 번 쓰냐야.
    - 매일 돌리면 3년에 1095번. 한 번에 731원이야. 커피 한 잔에 하루 설거지를 넘기는 셈이지.
    - 근데 주 2회만 돌리면 312번, 한 번에 2564원으로 뛰어. 같은 기계인데 세 배가 넘어.
    - 그리고 하나 더. 예비세척하고 수납하고 꺼내는 시간까지 따져봐. 손이 진짜 줄어드는지가 핵심이야.
  verdict: 아낀 시간이 자동으로 돈이 되진 않아. 몇 번 돌릴지부터 정하고 사.
  loop: 너희 집은 일주일에 몇 번 돌릴 것 같아?

008-commute-vs-rent:
  hook: 회사 앞으로 이사하면 월 12만원 더 나가. 대신 22시간이 생겨.
  stake: 한 줄만 계산하면 이사할지 말지 정해져.
  beats:
    - 회사 근처로 옮겨서 월세가 20만원 오르고, 교통비는 8만원 준다고 쳐.
    - 실제로 더 나가는 현금은 12만원이야. 20에서 8을 뺀 거지. 관리비나 이사비는 따로 봐야 하고.
    - 왕복 한 시간씩 22일이면 22시간. 12만원 나누기 22하면 시간당 5455원. 되찾는 한 시간에 그만큼 내는 셈이야.
    - 근데 시급만으로 정하지는 마. 지하철에서 자거나 공부하는 사람한테는 그 시간이 버린 시간이 아니거든.
  verdict: 현금 차액이랑 되찾는 시간, 둘을 따로 놓고 봐야 답이 나와.
  loop: 네 통근 한 시간, 얼마짜리 같아?

cx001-free-shipping:
  hook: 배송비 3000원 아끼려다 2900원 더 썼어.
  stake: 무료배송 버튼에는 안 보이는 가격표가 붙어 있거든.
  beats:
    - 장바구니가 27900원이야. 3만원부터 무료배송이고, 그 아래는 배송비 3000원.
    - 2100원만 더 담으면 되는데, 눈에 들어온 건 딱히 필요 없는 5900원짜리.
    - 자, 무료배송은 됐어. 근데 합계가 33800원이야. 그냥 배송비 내고 샀으면 30900원이었는데.
  verdict: 무료라는 글자 말고 마지막 합계를 봐. 원래 살 물건이면 합배송이 맞고, 아니면 거기서 멈춰.
  loop: 너희 집에도 배송비 대신 산 물건 있지? 그거 잘 썼어?

cx004-laptop-total:
  hook: 70만원짜리 노트북인데, 결제 끝나면 90만원이야.
  stake: 가격표 밖에 계산이 한 장 더 있거든.
  beats:
    - 본체는 70만원 맞아. 근데 쓸 수 있게 만들려면 허브 5만원, 저장장치 10만원, 메모리 5만원이 더 붙어.
    - 20만원이 본체값에서 빠져 있었던 거야. 비교는 70만원끼리 했는데 실제로 낸 건 90만원이지.
    - 물론 이미 갖고 있는 부품이면 얘기가 달라져. 그래서 확장이 되는지부터 봐야 하는 거고.
  verdict: 본체 가격 옆에 지금 당장 더 살 것들을 적어봐. 견적은 한 장이면 끝나.
  loop: 전자기기 사고 나서 예상 밖으로 더 산 거, 뭐였어?

cx005-coupon-minimum:
  hook: 5천원 쿠폰 썼는데 4천원을 더 냈어.
  stake: 쿠폰 조건이 내 장바구니보다 비쌀 때 벌어지는 일이야.
  beats:
    - 원래 살 건 36000원어치. 근데 쿠폰은 4만원부터야. 그래서 9천원짜리를 하나 더 담았어.
    - 합계 45000원에서 5000원 빠지니까 40000원. 할인은 분명 받았는데 원래보다 4천원을 더 낸 거야.
    - 그 9천원짜리가 원래 필요했던 거면 잘 산 거 맞아. 문제는 계획에 없던 걸 담았을 때지.
  verdict: 쿠폰 금액 말고 결제 총액을 비교해. 쿠폰 안 썼을 때랑 나란히 놓고.
  loop: 쿠폰 조건 맞추려고 뭘 더 담아봤어?

cx008-robot-prep:
  hook: 로봇청소기 샀는데 내가 바닥을 먼저 치우고 있어.
  stake: 청소 시간은 줄었는데 준비 시간이 생긴 거지.
  beats:
    - 버튼 누르기 전에 케이블 걷고, 양말 줍고, 장난감 치우고. 이게 매번이야.
    - 자동이라고 손이 아예 안 가는 건 아니야. 청소 시간만 보지 말고 준비랑 뒤처리까지 합쳐서 봐야 해.
    - 좋은 가전이냐보다 우리 집에 맞냐가 먼저야. 집 구조랑 사는 방식에 따라 완전히 달라지거든.
  verdict: 제품 사진 말고 우리 집 바닥 사진을 봐. 거기 치울 게 몇 개인지가 답이야.
  loop: 돌리기 전에 제일 먼저 치우는 거, 뭐야?
