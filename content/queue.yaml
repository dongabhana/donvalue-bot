  # ---------------------------------------------------------- 01
  - id: "001-coupang-wow"
    product: "쿠팡 와우 멤버십"
    price: "월 구독"
    hook: "한 달에 몇 번 시켜야 본전일까? 계산해봤다."
    verified: false
    verify:
      - "현재 쿠팡 와우 월 구독료"
      - "비회원 배송비 기준"
    cards:
      - title: "본전 계산은 딱 하나"
        body: "멤버십의 가치는 '무료배송 횟수 × 절약되는 배송비'다. 나머지 혜택(OTT, 반품)은 전부 덤으로 보고 시작하는 게 정확하다."
        note: "덤을 먼저 세면 무조건 이득처럼 보인다. 순서를 바꾸는 게 핵심."
      - title: "손익분기점"
        body: "월 구독료 ÷ 회당 배송비 = 손익분기 주문 횟수. 이 숫자보다 적게 시키면 그냥 돈을 버리는 중이다."
      - title: "함정은 여기"
        body: "무료배송이라는 이유로 '원래 안 살 물건'을 사게 되면 절약분보다 추가 지출이 더 커진다. 구독료가 아니라 소비 습관이 진짜 비용이다."
        note: "지난 3개월 주문 내역에서 '안 샀어도 됐던 것' 금액을 세어보면 답이 나온다."
      - title: "이런 사람은 무조건 이득"
        body: "1인 가구인데 생필품을 소량으로 자주 시키는 사람. 반대로 한 달에 1~2번 몰아서 대량 주문하는 집이면 회비가 그냥 새는 돈이다."
    verdict: 3
    verdict_text: "주문 빈도에 따라 정답이 갈린다. 손익분기 횟수를 넘기면 확실히 돈값, 못 넘기면 매달 조용히 새는 고정지출."
    caption: |
      쿠팡 와우, 돈값하나?

      혜택 개수로 따지면 무조건 이득처럼 보이는데
      계산 순서를 바꾸면 결론이 달라집니다.

      무료배송 횟수 × 배송비 = 실제 절약액
      이거 하나만 구독료랑 비교하면 끝.

      본인 주문 빈도 기준으로 손익분기 넘기시나요?
    threads_text: |
      쿠팡 와우 본전 계산법.

      혜택 나열부터 하면 무조건 이득처럼 보입니다.
      순서를 뒤집으세요.

      1) 한 달 무료배송 쓴 횟수
      2) × 회당 배송비
      3) 이게 구독료보다 크면 유지, 작으면 해지

      OTT나 반품 혜택은 전부 '덤'으로 빼고 계산해야 정확합니다.
      덤을 먼저 세면 판단이 흐려져요.
    hashtags: ["돈값하나", "생활비절약", "고정지출", "구독정리", "짠테크"]

  # ---------------------------------------------------------- 02
  - id: "002-water-purifier"
    product: "정수기 렌탈 vs 생수 배달"
    price: "3년 총비용"
    hook: "월 요금 말고 36개월 총액으로 보면 순위가 바뀐다."
    verified: false
    verify:
      - "정수기 렌탈 월 요금 + 설치비 + 의무약정 개월수"
      - "생수 2L 12개입 묶음 가격"
    cards:
      - title: "비교 단위를 바꿔라"
        body: "렌탈은 '월 얼마'로, 생수는 '한 묶음 얼마'로 광고한다. 단위가 다르니 비교가 안 된다. 둘 다 36개월 총액으로 환산해야 진짜 비교다."
      - title: "숨은 비용 3개"
        body: "렌탈은 설치비, 의무약정 위약금, 필터 교체 방문비가 따로 붙는 경우가 있다. 생수는 보관 공간과 빈 병 처리라는 비용이 든다."
        note: "약정 위약금은 '중간에 이사 갈 확률'과 곱해서 계산하는 게 현실적이다."
      - title: "물 사용량이 갈림길"
        body: "하루 2L 이하로 마시는 1인 가구면 생수가 대체로 싸다. 요리에 물을 쓰고 가족이 있으면 사용량이 뛰면서 렌탈이 유리해진다."
      - title: "가장 싼 선택지"
        body: "사실 1위는 자가 구매 정수기나 직수형 필터다. 초기 비용은 있지만 36개월 총액에서는 렌탈을 이기는 경우가 많다. 광고를 안 해서 안 보일 뿐."
    verdict: 3
    verdict_text: "월 요금이 아니라 36개월 총액으로 줄 세우면 순위가 뒤집힌다. 물 사용량이 적으면 렌탈은 대체로 비싼 선택."
    caption: |
      정수기 렌탈, 돈값하나?

      월 요금만 보면 싸 보이는데
      36개월 총액으로 환산하면 이야기가 달라집니다.

      설치비 + 위약금 + 방문 관리비까지 넣고
      생수 배달이랑 같은 단위로 비교해보세요.

      우리 집 물 사용량이 기준입니다.
    threads_text: |
      정수기 렌탈이 비싸 보이지 않는 이유는 단위 때문입니다.

      렌탈은 "월 얼마"
      생수는 "한 묶음 얼마"

      단위가 다르면 비교가 안 됩니다.
      둘 다 36개월 총액으로 바꿔보세요.

      여기에 설치비, 의무약정 위약금, 방문 관리비까지 넣으면
      생각보다 순위가 자주 뒤집힙니다.
    hashtags: ["돈값하나", "정수기렌탈", "생활비절약", "자취템", "고정지출"]

