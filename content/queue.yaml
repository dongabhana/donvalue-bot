        body: "통신비는 서비스 품질 차이가 작은데 가격 차이는 큰 몇 안 되는 항목이다. 같은 통신망을 빌려 쓰기 때문에 통화·데이터 품질 차이가 크지 않다."
        note: "다만 고객센터 응대와 멤버십 혜택은 확실히 줄어든다. 이건 감수 항목."
      - title: "차액을 2년으로 환산"
        body: "월 차액 × 24개월 = 갈아타기 1회의 가치. 한 번의 저녁 시간과 이 금액을 비교하면 대부분 답이 나온다."
      - title: "확인할 것 3개"
        body: "① 약정·할부금 남았는지 ② 결합할인 깨지는지 ③ 멤버십으로 실제 쓰던 혜택이 있는지. 이 3개만 넘기면 갈아타기 리스크는 거의 없다."
      - title: "가장 흔한 실수"
        body: "데이터 무제한을 기준으로 고르는 것. 최근 3개월 실사용량을 먼저 확인하면 한 구간 아래 요금제로도 충분한 경우가 많다."
    verdict: 5
    verdict_text: "확인 3개만 통과하면 손해 볼 구조가 거의 없다. 고정지출 항목 중 투입 시간 대비 회수액이 가장 큰 편."
    caption: |
      알뜰폰, 돈값하나?

      결론부터: 확인 3개만 통과하면 손해 보기 어렵습니다.

      ① 약정·할부금 남았는지
      ② 결합할인 깨지는지
      ③ 멤버십 실제로 쓰는지

      월 차액 × 24개월 = 갈아타기 한 번의 가치.
      대부분 저녁 한 번 값보다 큽니다.
    threads_text: |
      통신비는 품질 차이는 작은데 가격 차이는 큰,
      몇 안 되는 항목임.

      갈아타기 전에 볼 건 3개.
      1) 약정·할부금 잔여
      2) 결합할인 깨지는지
      3) 멤버십 진짜 쓰는지

      그리고 월 차액 × 24개월 계산해보셈.
      이게 저녁 한 끼 값보다 크면 그냥 하는 게 맞음.

      참고로 대부분은 데이터 무제한 필요 없음.
      최근 3개월 실사용량부터 보셈.
    hashtags: ["돈값하나", "알뜰폰", "통신비절약", "고정지출", "짠테크"]

