      body: 잔당 차액보다 '하루 몇 잔이냐'가 연간 총액을 결정한다. 하루 두 잔이면 브랜드를 바꾸는 것보다 한 잔을 줄이는 게 훨씬 크다.
    verdict: 3
    verdict_text: 앉아서 1시간 이상 있으면 브랜드 카페가 답이다. 테이크아웃 전용이면 저가 커피가 답이다.
    caption: |
      스타벅스, 돈값하나?

      질문을 바꿔야 답이 나옵니다.
      "커피를 사는가, 자리를 사는가"

      앉아서 두 시간 있으면 자리값이고
      들고 나가면 그냥 취향값입니다.

      여러분은 어느 쪽에 가까우세요?
    threads_text: |
      카페 소비의 핵심 질문.

      커피를 사는 건지, 자리를 사는 건지.

      앉아서 2시간 → 차액 ÷ 2시간 = 시간당 공간값
      스터디카페보다 쌈.

      테이크아웃이면 그냥 취향값임.
      본전 계산이 안 되는 영역임.

      근데 진짜 새는 건 잔당 차액이 아니라 빈도더라.
    threads_chain:
    - |
      자리값 계산도 한계가 있음.
      스터디카페는 콘센트랑 정숙이 보장됨.
      카페는 옆자리 운임.
      그거까지 같은 값으로 치긴 어려움.
    - |
      그리고 진짜 새는 건 잔당 차액이 아님.
      '커피 마시러 나가는 김에' 붙는 지출임.
