      블라인드로 들으면 대부분 구분 못 함.

      진짜 값어치는 노이즈캔슬링인데
      그건 '시끄러운 데서 오래 쓸 때'만 발생함.

      조용한 집에서만 쓸 거면
      그 기능값은 그냥 버리는 돈임.
    threads_chain:
    - |
      노캔이 필요 없다고 단정하긴 이름.
      출퇴근 지하철이 하루 1시간이면
      그게 '시끄러운 데서 오래'에 정확히 해당함.
      집에서만 쓰는 경우랑 결론이 완전히 갈림.
    - |
      그리고 애플 기기 여러 개 쓰면 연결 전환값이 따로 있음.
      음질이랑 상관없는데 체감은 이게 제일 큼.
    hashtags:
    - 돈값하나
