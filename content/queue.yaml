      (학원비 + 응시료 + 교재비) ÷ 월 수당 = 회수 개월수

      24개월 넘으면 투자보다 취미에 가깝습니다.

      시작 전에 5분만 쓰세요.
      ① 취업규칙 자격수당 항목 확인
      ② 채용공고에 실제로 요구되는지 검색
    threads_text: |
      자격증 딸까 말까 할 때.

      (학원비 + 응시료 + 교재비) ÷ 월 자격수당 = 회수 개월수

      24개월 넘어가면 투자보다는 취미에 가까움.

      근데 진짜 비용은 학원비가 아니라 시간임.
      준비 100시간짜리면 내 시급 × 100이 원가.

      시작하기 전에 취업규칙 자격수당 항목부터 보셈.
      5분이면 끝남.
    threads_chain:
    - |
