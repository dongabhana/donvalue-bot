      '막힌 횟수'를 기억으로 세면 무조건 과대평가됨.
      한 주만 메모해보고 곱하기 4 하는 게 정확함.
    - |
      3개 다 쓰는 사람도 있긴 함.
      근데 그런 경우는 용도가 완전히 갈려 있음.
      겹치면 한 개만 남기는 게 맞음.
