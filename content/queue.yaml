        body: "헬스장 1년권은 '안 나올 사람'을 전제로 설계된 가격이다. 전원이 매일 나오면 그 가격이 성립하지 않는다. 즉 결제하는 순간 나는 통계에 베팅하는 것이다."
      - title: "실제 단가 공식"
        body: "1년권 가격 ÷ 실제 출석 횟수 = 1회당 비용. 주 1회만 가면 1회 이용료가 웬만한 PT 체험가에 가까워진다."
        note: "달력에 출석 표시만 해도 이 숫자가 눈에 보인다."
      - title: "손익분기 출석률"
        body: "1년권이 월권의 8개월치라면, 최소 8개월 이상 꾸준히 다녀야 본전이다. 지금까지 운동을 3개월 넘게 이어간 적이 없다면 월권이 정답이다."
      - title: "더 싼 방법도 있다"
        body: "지자체 공공체육시설, 회사 복지포인트, 국민체력100 연계 프로그램은 민간 헬스장보다 훨씬 싸다. 아무도 광고하지 않아서 모를 뿐이다."
    verdict: 2
    verdict_text: "운동 습관이 이미 있는 사람에게만 할인이다. 습관을 만들려고 1년권을 끊는 건 동기부여 비용을 12개월치 선결제하는 것에 가깝다."
    caption: |
      헬스장 1년권, 돈값하나?

      1년권은 할인이 아니라
      '안 나올 확률'에 매겨진 가격입니다.

      1년권 가격 ÷ 실제 출석 횟수 = 1회 이용료
      이 숫자를 계산해보면 결론이 빨리 납니다.

      습관이 있는 사람에게만 할인, 없는 사람에겐 선결제.
    threads_text: |
      헬스장 1년권이 싼 이유는 할인이 아닙니다.
      "안 나올 사람"을 전제로 짜여진 가격이라 그렇습니다.

      회원 전원이 매일 출석하면 그 가격은 성립 자체가 안 돼요.

      계산은 하나면 됩니다.
      1년권 가격 ÷ 실제 출석 횟수 = 1회당 비용

      주 1회 가면 1회 이용료가 PT 체험가 수준이 됩니다.
      습관이 있는 사람에게만 할인입니다.
