        body: "들고 나가서 30분 안에 마실 거라면 브랜드 차액은 순수하게 맛과 이미지 값이다. 이건 취향의 영역이라 본전 계산이 안 된다."
      - title: "진짜 새는 건 빈도"
        body: "잔당 차액보다 '하루 몇 잔이냐'가 연간 총액을 결정한다. 하루 두 잔이면 브랜드를 바꾸는 것보다 한 잔을 줄이는 게 훨씬 크다."
    verdict: 3
    verdict_text: "앉아서 오래 있으면 자리값으로 충분히 돈값. 테이크아웃 전용이면 그냥 취향값이다."
    caption: |
      스타벅스, 돈값하나?

      질문을 바꿔야 답이 나옵니다.
      "커피를 사는가, 자리를 사는가"

      앉아서 두 시간 있으면 자리값이고
      들고 나가면 그냥 취향값입니다.

      여러분은 어느 쪽에 가까우세요?
    threads_text: |
      카페 소비의 핵심 질문.

      커피를 사는 건지, 자리를 사는 건지.

      앉아서 2시간 → 차액 ÷ 2시간 = 시간당 공간값
      스터디카페보다 쌈.

      테이크아웃이면 그냥 취향값임.
      본전 계산이 안 되는 영역임.

      근데 진짜 새는 건 잔당 차액이 아니라 빈도더라.
