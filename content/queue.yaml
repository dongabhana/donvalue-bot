      body: 유료의 값어치는 기능 개수가 아니라 '무료로는 막히는 순간'의 빈도다. 그 순간이 한 달에 몇 번인지 세보는 게 먼저다.
      note: 막힌 적이 없으면 그건 아직 유료가 필요한 단계가 아니라는 뜻이다.
    - title: 시간으로 환산해라
      body: 월 구독료를 본인 시급으로 나누면 '몇 시간을 아껴야 본전인지'가 나온다. 이 숫자가 한 달 기준 한 자리면 대체로 이득이다.
    - title: 3개 동시 구독의 함정
      body: 여러 개를 같이 쓰면 각각의 사용 빈도가 쪼개진다. 결제는 3배인데 활용은 1.3배쯤 되는 구간이 생긴다. 하나를 깊게 쓰는 편이 대체로 낫다.
      note: 정말 필요하면 한 달씩 번갈아 결제해보고 비교하는 방법도 있다.
    - title: 이런 사람은 무조건 이득
      body: 글을 매일 쓰거나, 코드를 짜거나, 자료를 정리하는 일이 업무인 사람. 반대로 가끔 검색 대용으로만 쓴다면 무료로 충분하다.
    verdict: 4
    verdict_text: 하나를 깊게 쓰는 게 답이다. 3개 동시 결제는 결제만 3배고 활용은 1.3배다.
    caption: |
      AI 구독, 돈값하나?

      "무료로도 되는데 왜 돈을 내지?"
      이 질문의 답은 기능 비교표에 없습니다.

      무료로 막히는 순간이 한 달에 몇 번인지
      그거 하나만 세보면 됩니다.

      여러분은 몇 번쯤 막히시나요?
    threads_text: |
      AI 구독 본전 계산.

      기능 비교표부터 보면 답이 안 나옴.
