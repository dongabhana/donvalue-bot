  - id: "004-ott-stack"
    product: "OTT 4개 동시 구독"
    price: "시청시간 단가"
    hook: "월 얼마가 아니라 '1시간당 얼마'로 보면 정리할 게 보인다."
    verified: false
    verify:
      - "본인이 구독 중인 OTT 목록과 각 월 요금"
    cards:
      - title: "구독료는 비교 기준이 아니다"
        body: "OTT는 전부 만원 안팎이라 가격만 보면 다 비슷해 보인다. 비교해야 할 건 요금이 아니라 '내가 실제로 본 시간'이다."
      - title: "시청시간 단가"
        body: "월 요금 ÷ 그 달에 본 시간 = 1시간당 비용. 한 달에 2시간 본 서비스는 1시간에 수천 원짜리 콘텐츠를 본 셈이다."
        note: "대부분의 앱은 시청기록 메뉴에서 지난달 기록을 볼 수 있다."
      - title: "가장 잘 새는 유형"
        body: "특정 시리즈 하나 보려고 결제했다가 그대로 두는 경우. 구독은 끊는 데 드는 에너지가 결제할 때보다 크게 설계돼 있다."
      - title: "현실적인 운영법"
        body: "동시 2개까지만 두고, 보고 싶은 게 생기면 그 달에만 켜는 방식. 연 단위로 보면 상시 4개 구독 대비 절반 이하로 떨어진다."
    verdict: 2
    verdict_text: "4개를 상시로 켜두는 건 대체로 돈값 못 한다. '시청시간 단가'로 줄 세워서 하위 2개를 끄는 게 가장 빠른 절감."
    caption: |
      OTT 4개 구독, 돈값하나?

      요금은 다 비슷하니 비교가 안 됩니다.
      기준을 바꿔보세요.

      월 요금 ÷ 그 달 시청 시간 = 1시간당 비용

      이걸로 줄 세우면 해지 대상이 바로 보입니다.
      상시 4개보다 필요할 때만 켜는 쪽이 연 단위로 훨씬 쌉니다.
    threads_text: |
      OTT 정리할 때 요금을 비교하면 답이 안 나옵니다.
      다 만원 안팎이라 비슷해 보이거든요.

      기준을 바꾸세요.
      월 요금 ÷ 그 달에 실제 본 시간 = 1시간당 비용

      한 달에 2시간 본 서비스는
      1시간에 수천 원짜리 콘텐츠를 본 겁니다.

      이 숫자로 줄 세워서 하위 2개만 꺼도 체감이 큽니다.
    hashtags: ["돈값하나", "구독정리", "OTT", "고정지출", "생활비절약"]

