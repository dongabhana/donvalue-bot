      에어컨 껐다 켜기, 기준선은 90분임.

      30분 나갔다 오면 재가동에 전력 5% 더 씀
      60분이면 2% 더 씀
      90분 넘어야 끄는 게 이김

      그리고 제습이 더 싸다는 말, 시험 결과로는 거의 차이 없었음.
      24℃ 냉방 1.782kWh / 24℃ 제습 1.878kWh.

      껐다 켜기 고민할 시간에 26℃로 올리는 게 훨씬 큼. 이게 0.7배임.
    threads_chain:
