      - title: "자리값으로 보면 저렴하다"
        body: "차액을 체류 시간으로 나누면 시간당 얼마짜리 공간을 쓰는 셈인지 나온다. 스터디카페나 공유오피스와 비교하면 오히려 싼 경우가 많다."
