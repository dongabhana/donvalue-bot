      1) 무료 버전에서 막힌 횟수 (한 달)
      2) 그때 날린 시간 × 내 시급
      3) 이게 구독료보다 크면 유지

      3개 동시 구독은 대체로 낭비임.
      결제는 3배인데 활용은 1.3배쯤 되더라.
    threads_chain:
    - |
