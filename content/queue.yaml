    - 리뷰

  # ------------------------------------------------------ 014-delivery-vs-pickup
  - id: 014-delivery-vs-pickup
    product: 배달 vs 포장
    price: 같은 메뉴
    hook: 같은 치킨인데 왜 값이 다를까?
    verified: true
    ask: 자주 시키는 메뉴의 배달가 vs 매장가, 배달비
    threads_tag: 자취
    threads_question: 배달비 얼마부터 포장하러 나감?
    verify:
    - 구체 금액은 카드에 넣지 않음 — 구조만 설명
    cards:
    - title: 차액은 배달비만이 아니다
      body: 배달앱은 수수료가 붙는 만큼 메뉴 가격 자체가 매장보다 높게 책정되는 경우가 많다. 배달비를 0원으로 만들어도 차액이 남는 이유다.
      note: 같은 가게 매장 메뉴판과 앱 가격을 한 번 비교해보면 바로 보인다.
    - title: 무료배달의 진짜 의미
      body: 배달비가 사라졌다면 그 비용은 어딘가로 옮겨간 것이다. 대개 음식 가격이나 최소 주문 금액에 녹아 있다.
    - title: 포장의 비용도 계산하라
      body: 왕복 이동 시간과 기름값·교통비가 든다. 도보 5분이면 포장이 압도적이지만, 차로 15분이면 계산이 뒤집힐 수 있다.
    - title: 가장 크게 새는 지점
      body: 최소 주문 금액을 맞추려고 안 시킬 메뉴를 추가하는 것. 배달비를 아끼려다 더 큰 돈을 쓰는 전형적인 패턴이다.
    verdict: 2
    verdict_text: 도보권이면 포장이 답이다. 배달의 값어치는 음식이 아니라 나가지 않아도 되는 시간에 있다.
    caption: |
      배달 vs 포장, 돈값하나?

      배달비를 0원으로 만들어도
      같은 메뉴 값이 다른 이유가 있습니다.

      앱 수수료가 메뉴 가격에 녹아 있거든요.
      무료배달이라는 말의 진짜 뜻입니다.

      배달비 얼마부터 나가서 포장하세요?
    threads_text: |
      배달앱에서 제일 크게 새는 돈.

      배달비 아님.

      최소 주문 금액 맞추려고
      안 시킬 메뉴 하나 더 담는 거임.

      3천원 아끼려다 8천원 씀.
      이게 제일 흔한 패턴임.
    threads_chain:
    - |
      포장이 항상 이기는 것도 아님.
      왕복 20분 걸리는 거리면 그 시간값이 배달비보다 큼.
      걸어서 5분 안쪽일 때만 확실한 이득임.
    - |
      최소주문 채우려고 담은 메뉴,
      다음날 먹는 경우 거의 없음.
      그 음식값은 사실상 전부 손실임.
    hashtags:
    - 돈값하나
    - 생활비절약
    - 배달앱
    - 식비
    - 짠테크

