# ============================================================
#  '돈값하나?' 발행 큐
#  - 위에서부터 순서대로 발행됨 (verified: true 인 것만)
#  - 발행되면 content/posted.json 에 기록되고 자동으로 건너뜀
#  - verified: false 는 발행 안 됨 → verify 항목 확인 후 true 로 변경
#  - cards 는 3~5개 권장 (표지 + 본문 + 결론 = 총 5~7장)
#  - 릴스 훅·화자·배경음 무드는 content/hooks.yaml 에서 편별로 관리
#  - ig_format: carousel 을 적으면 그 편은 릴스 대신 카드뉴스로만 나간다
#  - brand 를 적으면 그 편만 다른 시리즈 이름으로 나간다
#      "돈값하나?"       살까 말까 (제품·구독)
#      "몰라서 내는 돈"  제도·설정·요금제 — 몰라서 새는 돈
# ============================================================
brand: 돈값하나?
handle: '@dongabhana'
cta:
  card_top: 다음엔 뭐가 궁금하세요?
  card_bottom: 댓글로 신청받습니다
  caption_tail: 다음에 계산해줬으면 하는 거 있으면 댓글로 남겨주세요. 하나씩 다 따져봅니다.
  first_comment: |-
    계산에 쓴 가격은 전부 게시일 기준으로 직접 확인한 값이에요. 바뀐 게 있으면 댓글로 알려주시면 다시 계산해서 올릴게요.

    본인 숫자로 넣어봤을 때 결과가 다르게 나온 분들, 어떻게 나왔는지 궁금합니다.
  threads_tail: 다음엔 뭐 계산해볼까. 궁금한 거 답글로 던져주셈.
  threads_reel_tail: |-
    이거 영상으로도 정리해놨음. 인스타 @dongabhana 릴스에 있음.
    다음엔 뭐 계산해볼까. 답글로 던져주셈.

items:
  # ------------------------------------------------------ 001-coupang-wow
  - id: 001-coupang-wow
    product: 쿠팡 와우 멤버십
    price: 월 구독
    hook: 한 달에 몇 번 시켜야 본전일까? 계산해봤다.
    verified: true
    threads_tag: 생활비절약
    threads_question: 님들은 한 달에 몇 번쯤 시킴? 본전은 넘김?
    verify:
    - 현재 쿠팡 와우 월 구독료 (7,890원 · 사용자 확인)
    - 비회원 배송비 기준
    cards:
    - title: 본전 계산은 딱 하나
      body: 멤버십의 가치는 '무료배송 횟수 × 절약되는 배송비'다. 나머지 혜택(OTT, 반품)은 전부 덤으로 보고 시작하는 게 정확하다.
      note: 덤을 먼저 세면 무조건 이득처럼 보인다. 순서를 바꾸는 게 핵심.
    - title: 손익분기점
      figure: 7,890원
      figure_label: 와우 멤버십 월 회비
      as_of: 2026년 9월 기준
      body: 비회원은 19,800원 미만이면 배송비가 붙는다. 그 미만 주문을 한 달에 몇 번 하는지 세고, 거기에 회당 배송비를 곱해 회비와 비교하면 답이 나온다.
    - title: 함정은 여기
      body: 무료배송이라는 이유로 '원래 안 살 물건'을 사게 되면 절약분보다 추가 지출이 더 커진다. 구독료가 아니라 소비 습관이 진짜 비용이다.
      note: 지난 3개월 주문 내역에서 '안 샀어도 됐던 것' 금액을 세어보면 답이 나온다.
    - title: 이런 사람은 무조건 이득
      body: 1인 가구인데 생필품을 소량으로 자주 시키는 사람. 반대로 한 달에 1~2번 몰아서 대량 주문하는 집이면 회비가 그냥 새는 돈이다.
    verdict: 3
    verdict_text: 지난달 무료배송을 3회 이상 썼으면 유지, 그 아래면 해지가 답이다. 주문 내역 한 번만 세면 결론이 나온다.
    caption: |
      쿠팡 와우, 돈값하나?

      혜택 개수로 따지면 무조건 이득처럼 보이는데
      계산 순서를 바꾸면 결론이 달라집니다.

      무료배송 횟수 × 배송비 = 실제 절약액
      이거 하나만 구독료랑 비교하면 끝.

      본인 주문 빈도 기준으로 손익분기 넘기시나요?
    threads_text: |
      쿠팡 와우 본전 계산, 순서를 뒤집어야 답이 나옴.

      혜택부터 세면 무조건 이득처럼 보이거든.

      1) 한 달에 무료배송 쓴 횟수
      2) × 회당 배송비
      3) 이게 구독료보다 크면 유지, 작으면 해지

      OTT니 반품이니 하는 건 다 '덤'으로 빼고 계산해야 정확함.
      덤을 먼저 세는 순간 판단이 흐려짐.
    threads_chain:
    - |
      근데 이 계산에 안 잡히는 게 하나 있음.
      무료배송이라고 원래 안 살 걸 장바구니에 담는 거.
      최근 3개월 주문내역 훑어보면 그 금액이 대충 보임.
    - |
      회비 7,890원은 9월에 직접 확인한 값임.
      바뀌었으면 댓글로 알려주셈. 바로 다시 계산함.
    hashtags:
    - 돈값하나
    - 생활비절약
    - 고정지출
    - 구독정리
    - 짠테크
    ig_format: carousel

  # ------------------------------------------------------ 002-water-purifier
  - id: 002-water-purifier
    product: 정수기 렌탈 vs 생수
    price: 월 26,900원
    hook: 답은 네가 무슨 물을 마시냐에 달렸다.
    verified: true
    threads_tag: 자취
    threads_question: 님들은 생수 뭐 드심?
    ask: 쓰는 정수기 월 렌탈료와 자주 사는 생수 브랜드·가격
    verify:
    - '정수기 렌탈료 26,900원: 코웨이 아이콘정수기3 기본 약정가 (2026.9)'
    - '브랜드 생수 2L: 아이시스 1,042 · 백산수 1,295 · 평창수 1,233 → 평균 약 1,200원 (쿠팡, 2026.9)'
    - '최저가 PB: 쿠팡 탐사수 2L 12개 5,990원 → 약 500원 (2026.9)'
    cards:
    - title: 질문을 바꿔야 답이 나온다
      body: 정수기가 싸냐 비싸냐가 아니다. 정수기 렌탈료를 생수 한 병 값으로 나누면 '하루 몇 리터를 마셔야 본전인지'가 나온다. 그 숫자를 내 음수량과 비교하면 끝이다.
    - title: 브랜드 생수를 마신다면
      figure: 하루 1.5L
      figure_label: 브랜드 생수(약 1,200원/2L) 기준 손익분기
      as_of: 2026년 9월 · 렌탈 26,900원 기준
      body: 26,900원 ÷ 1,200원 = 약 22병. 2L짜리 22병이면 한 달 45L, 하루 1.5L다. 성인 권장 음수량이 2L 안팎이니 혼자 살아도 넘기는 양이다.
      note: 아이시스 1,042 · 백산수 1,295 · 평창수 1,233원 기준 평균값이다.
    - title: 최저가 생수를 마신다면
      figure: 하루 3.6L
      figure_label: PB 생수(약 500원/2L) 기준 손익분기
      as_of: 쿠팡 탐사수 12개 5,990원 기준
      body: 같은 렌탈료라도 500원짜리 물로 나누면 54병, 하루 3.6L가 된다. 1~2인 가구가 넘기기 어려운 양이라 이 경우엔 생수가 이긴다.
    - title: 그래서 갈림길은 하나
      body: 브랜드 물을 고집하면 정수기가 이기고, 최저가 PB로 충분하면 생수가 이긴다. 가족 수가 늘면 두 경우 모두 정수기 쪽으로 기운다.
      note: 정수기가 파는 건 물값만이 아니다. 무거운 걸 안 나르는 것과 온수·냉수도 값에 포함된다.
    verdict: 3
    verdict_text: 무슨 물을 마시냐가 답을 가른다. 브랜드 생수파면 정수기가 이득, 최저가 PB로 충분하면 생수가 이득.
    caption: |
      정수기 렌탈, 돈값하나?

      계산해보니 답이 하나가 아니었습니다.
      무슨 물을 마시느냐에 따라 갈려요.

      정수기 렌탈 월 26,900원 기준

      브랜드 생수(약 1,200원/2L)를 마신다면
      → 하루 1.5L만 마셔도 정수기가 본전

      최저가 PB 생수(약 500원/2L)라면
      → 하루 3.6L를 마셔야 본전

      성인 권장 음수량이 하루 2L 안팎이니
      브랜드 물 드시는 분은 정수기가 이득,
      최저가로 충분하신 분은 생수가 이득입니다.

      여러분은 어느 쪽이세요?
    threads_text: |
      정수기 렌탈 본전 계산해봤음.

      월 26,900원을 생수 한 병 값으로 나누면
      하루 몇 리터 마셔야 본전인지 나옴.

      브랜드 생수 1,200원/2L → 하루 1.5L
      최저가 PB 500원/2L → 하루 3.6L

      근데 성인 권장 음수량이 2L 안팎이잖아.
      삼다수 사 먹던 사람은 정수기가 이득이고
      최저가로 충분했던 사람은 그냥 생수가 낫다는 소리.

      정수기가 비싸냐 싸냐 문제가 아니었음.
      내가 무슨 물 마시냐의 문제였음.
    threads_chain:
    - |
      반론 하나 미리 적어둠.
      정수기가 파는 게 물값만은 아님.
      무거운 거 안 나르는 값이랑 온수값이 따로 있음.
      그거까지 치면 손익분기는 더 내려감.
    - |
      대신 필터값이랑 위약금은 계산에서 뺐음.
      약정 중간에 깨면 숫자가 통째로 뒤집힘.
      이건 각자 계약서를 봐야 함.
    hashtags:
    - 돈값하나
    - 정수기
    - 생수
    - 생활비절약
    - 자취

  # ------------------------------------------------------ 003-gym-annual
  - id: 003-gym-annual
    product: 헬스장 1년권
    price: 연간 결제
    hook: 할인율이 아니라 출석률이 가격을 정한다.
    verified: true
    ask: 헬스장 연간권 가격과 월 단위로 끊을 때 가격 (다니는 곳 기준)
    threads_tag: 운동
    threads_question: 연간권 끊고 몇 달 만에 안 가게 됐음?
    verify:
    - 비교할 헬스장의 1개월권 / 12개월권 실제 가격
    cards:
    - title: 1년권은 할인 상품이 아니다
      body: 헬스장 1년권은 '안 나올 사람'을 전제로 설계된 가격이다. 전원이 매일 나오면 그 가격이 성립하지 않는다. 즉 결제하는 순간 나는 통계에 베팅하는 것이다.
    - title: 실제 단가 공식
      body: 1년권 가격 ÷ 실제 출석 횟수 = 1회당 비용. 주 1회만 가면 1회 이용료가 웬만한 PT 체험가에 가까워진다.
      note: 달력에 출석 표시만 해도 이 숫자가 눈에 보인다.
    - title: 손익분기 출석률
      body: 1년권이 월권의 8개월치라면, 최소 8개월 이상 꾸준히 다녀야 본전이다. 지금까지 운동을 3개월 넘게 이어간 적이 없다면 월권이 정답이다.
    - title: 더 싼 방법도 있다
      body: 지자체 공공체육시설, 회사 복지포인트, 국민체력100 연계 프로그램은 민간 헬스장보다 훨씬 싸다. 아무도 광고하지 않아서 모를 뿐이다.
    verdict: 2
    verdict_text: 운동을 3개월 넘게 이어간 적이 없다면 월권이 답이다. 1년권은 3개월을 넘기고 나서 끊어도 늦지 않다.
    caption: |
      헬스장 1년권, 돈값하나?

      1년권은 할인이 아니라
      '안 나올 확률'에 매겨진 가격입니다.

      1년권 가격 ÷ 실제 출석 횟수 = 1회 이용료
      이 숫자를 계산해보면 결론이 빨리 납니다.

      습관이 있는 사람에게만 할인, 없는 사람에겐 선결제.
    threads_text: |
      헬스장 1년권이 싼 건 할인이 아님.
      '안 나올 사람' 전제로 짜인 가격이라 그럼.

      회원 전원이 매일 출석하면 그 가격 자체가 성립을 안 함.

      계산은 하나면 됨.
      1년권 가격 ÷ 실제 출석 횟수 = 1회당 비용

      주 1회 가면 1회 이용료가 PT 체험가 수준 나옴.
      결국 습관 있는 사람한테만 할인이었음.
    threads_chain:
    - |
      1년권이 무조건 손해라는 소리는 아님.
      이미 습관 있는 사람한텐 진짜 할인 맞음.
      문제는 '습관을 만들려고' 1년권을 끊는 경우임.
    - |
      잘 안 알려진 선택지 하나.
      지자체 공공체육시설은 민간 절반 이하인 데가 많음.
      광고를 안 해서 모를 뿐임.
    hashtags:
    - 돈값하나
    - 헬스장
    - 운동습관
    - 소비패턴
    - 짠테크

  # ------------------------------------------------------ 004-ott-stack
  - id: 004-ott-stack
    product: OTT 4개 동시 구독
    price: 시청시간 단가
    hook: 월 얼마가 아니라 '1시간당 얼마'로 보면 정리할 게 보인다.
    verified: true
    ask: 구독 중인 OTT와 각 월 요금
    threads_tag: 구독
    threads_question: 지금 OTT 몇 개 결제 중임?
    verify:
    - 본인이 구독 중인 OTT 목록과 각 월 요금
    cards:
    - title: 구독료는 비교 기준이 아니다
      body: OTT는 전부 만원 안팎이라 가격만 보면 다 비슷해 보인다. 비교해야 할 건 요금이 아니라 '내가 실제로 본 시간'이다.
    - title: 시청시간 단가
      body: 월 요금 ÷ 그 달에 본 시간 = 1시간당 비용. 한 달에 2시간 본 서비스는 1시간에 수천 원짜리 콘텐츠를 본 셈이다.
      note: 대부분의 앱은 시청기록 메뉴에서 지난달 기록을 볼 수 있다.
    - title: 가장 잘 새는 유형
      body: 특정 시리즈 하나 보려고 결제했다가 그대로 두는 경우. 구독은 끊는 데 드는 에너지가 결제할 때보다 크게 설계돼 있다.
    - title: 현실적인 운영법
      body: 동시 2개까지만 두고, 보고 싶은 게 생기면 그 달에만 켜는 방식. 연 단위로 보면 상시 4개 구독 대비 절반 이하로 떨어진다.
    verdict: 2
    verdict_text: 상시 4개는 답이 아니다. 시청시간 단가로 줄 세워 하위 2개를 끄는 게 가장 빠른 절감이다.
    caption: |
      OTT 4개 구독, 돈값하나?

      요금은 다 비슷하니 비교가 안 됩니다.
