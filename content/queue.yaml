  - id: "007-dishwasher"
    product: "식기세척기"
    price: "시간을 시급으로"
    hook: "가전은 가격이 아니라 회수 기간으로 판단한다."
    verified: true
    ask: "식기세척기 구매가 (관심 모델 기준)"
    threads_tag: "살림"
    threads_question: "식기세척기 쓰는 사람, 손설거지로 돌아갈 수 있음?"
    verify:
      - "비교할 제품의 실구매가 및 설치비"
    cards:
      - title: "회수 기간이라는 기준"
        body: "시간을 아껴주는 가전은 '구매가 ÷ 아끼는 시간의 가치'로 본다. 하루 20분을 아끼면 한 달에 10시간, 1년이면 120시간이다."
      - title: "본인 시급을 넣어라"
        body: "연봉 ÷ 2,000시간 ≈ 시급. 이 시급에 연 120시간을 곱하면 식기세척기가 1년에 만들어내는 시간 가치가 나온다. 대부분 기기값을 넘긴다."
        note: "이 계산은 '아낀 시간을 실제로 쉬거나 벌이에 쓸 때'만 성립한다."
      - title: "빠지기 쉬운 비용"
        body: "설치비, 전용 세제, 전기·수도 요금, 그리고 애초에 안 쓰게 될 확률. 주방 공간이 애매하면 구매 후 방치되는 경우가 실제로 많다."
      - title: "같은 논리가 적용되는 것들"
        body: "로봇청소기, 건조기, 에어프라이어도 전부 같은 공식이다. 반대로 '가끔 쓰는' 가전은 이 공식에서 회수 기간이 수십 년으로 나온다."
    verdict: 4
    verdict_text: "매일 쓰는 시간 절약형 가전은 대체로 돈값한다. 단, 설치 가능 여부와 사용 빈도를 먼저 확인해야 한다."
    caption: |
      식기세척기, 돈값하나?

      가전은 가격이 아니라 회수 기간으로 봅니다.

      1) 하루 아끼는 시간 × 365
      2) × 내 시급 (연봉 ÷ 2,000)
      3) 이게 구매가를 언제 넘기는지

      매일 쓰는 가전은 대체로 1년 안에 회수됩니다.
      가끔 쓰는 가전은 수십 년이 나옵니다.
    threads_text: |
      시간 아껴주는 가전 살까 말까 할 때 쓰는 공식.

      구매가 ÷ (아끼는 시간 × 내 시급) = 회수 기간

      시급은 연봉 ÷ 2,000시간으로 대충 잡으면 됨.

      하루 20분이면 1년에 120시간임.
      매일 쓰는 가전은 이 계산에서 거의 다 이김.

      단, 아낀 시간을 진짜 쉬거나 버는 데 써야 성립함.
      안 그러면 그냥 유튜브 시간만 늘어남.
    hashtags: ["돈값하나", "식기세척기", "가전", "시간관리", "살림템"]

