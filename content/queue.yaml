  - id: "006-car-tco"
    product: "차 유지비"
    price: "5년 총소유비용"
    hook: "차값보다 5년 유지비가 더 나올 수도 있다."
    verified: true
    ask: "월 주유비, 보험료(연), 정비비(연) 대략"
    threads_tag: "자동차"
    threads_question: "차 유지비 월에 얼만지 계산해본 적 있음?"
    verify:
      - "본인 차량 기준 연간 보험료 / 세금 / 평균 주유비"
    cards:
      - title: "차값은 절반짜리 숫자다"
        body: "실제 비용은 차값이 아니라 TCO(총소유비용)다. 취득세, 보험, 자동차세, 유류비, 소모품, 주차비, 감가상각까지 합쳐야 진짜 가격이 나온다."
      - title: "가장 크게 새는 항목"
        body: "감가상각이다. 눈에 안 보이는데 금액이 제일 크다. 5년 뒤 중고 시세를 미리 확인하면 이 비용을 숫자로 볼 수 있다."
        note: "출고가 - 5년 뒤 예상 중고가 = 실제로 소비한 금액."
      - title: "월 환산이 유일한 방법"
        body: "5년 TCO ÷ 60개월 = 월 실질 비용. 이 숫자를 월급과 나란히 놓아야 감당 가능한지 판단이 된다. 할부금만 보면 무조건 감당 가능해 보인다."
      - title: "차가 돈값하는 조건"
        body: "출퇴근 대중교통이 왕복 2시간 이상이거나, 차가 있어야 벌 수 있는 수입이 있을 때. 주말에만 쓰는 차는 렌트·카셰어링 총액이 거의 항상 더 싸다."
    verdict: 3
    verdict_text: "사용 빈도가 전부다. 매일 타면 시간을 사는 것이고, 주말에만 타면 감가상각을 매달 사는 것이다."
    caption: |
      차 유지비, 돈값하나?

      차값은 절반짜리 숫자입니다.
      진짜 가격은 5년 총소유비용(TCO).

      취득세 + 보험 + 세금 + 유류비 + 소모품 + 주차비 + 감가상각

      이걸 60개월로 나눠서 월급 옆에 놓아보세요.
      할부금만 볼 때랑 완전히 다른 숫자가 나옵니다.
    threads_text: |
      차 살 때 제일 자주 빠지는 비용이 감가상각임.
      눈에 안 보이는데 금액은 제일 큼.

      계산은 간단함.
      출고가 - 5년 뒤 예상 중고가 = 실제로 태운 돈

      여기에 보험, 세금, 기름값, 소모품, 주차비 다 더하고
      60개월로 나눠보셈.

      할부금만 보면 다 감당될 것 같음.
      월 환산으로 보면 얘기가 달라짐.
    hashtags: ["돈값하나", "차유지비", "TCO", "감가상각", "자동차"]

