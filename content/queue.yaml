      body: 할인율이 아니라 '월 최대 할인 한도'가 본전을 결정한다. 10% 할인이어도 월 한도가 낮으면 그 위로는 아무 혜택이 없다.
      note: 카드 상세페이지에서 가장 작은 글씨로 적힌 부분이 대개 이 한도다.
    - title: 전월 실적이라는 조건
      body: 대부분의 혜택은 전달에 일정 금액 이상을 써야 켜진다. 그 금액을 채우려고 쓰는 돈이 있다면 그건 할인이 아니라 지출이다.
    - title: 본전 계산식
      body: 연회비 ÷ 12 = 월 최소 확보 할인액. 이 금액을 실적 조건 안에서 매달 확실히 채울 수 있어야 본전이다.
    - title: 가장 흔한 착각
      body: 혜택 항목이 많은 카드가 좋아 보이지만, 실제로는 본인이 매달 쓰는 한두 곳에서만 할인이 나온다. 나머지는 계산에서 빼는 게 정확하다.
    verdict: 3
    verdict_text: 고정 지출이 명확하면 연회비 카드가 답이다. 소비가 들쭉날쭉하면 연회비 없는 카드로 가라.
    caption: |
      연회비 카드, 돈값하나?

      할인율 보고 고르면 대부분 손해입니다.
      봐야 할 건 따로 있어요.

      '월 최대 할인 한도'
      가장 작은 글씨로 적혀 있는 그 숫자입니다.

      연회비 카드 본전 뽑고 계신가요?
    threads_text: |
      연회비 카드 본전 계산.

      연회비 ÷ 12 = 월에 확보해야 할 할인액

      근데 여기 함정이 두 개 있음.

      1) 월 최대 할인 한도 (위로는 혜택 없음)
      2) 전월 실적 조건

      실적 채우려고 쓰는 돈은
      할인이 아니라 그냥 지출임.
    threads_chain:
    - |
      함정이 하나 더 있음.
      할인 한도가 월 1만원인데 연회비가 10만원이면
      12달 내내 한도를 꽉 채워야 겨우 본전임.
      실제로 채운 달이 몇 달인지 세보면 답 나옴.
    - |
      전월 실적 채우려고 쓰는 돈은 할인이 아니라 지출임.
      카드사가 노리는 게 정확히 그 지점임.
    hashtags:
    - 돈값하나
    - 신용카드
    - 재테크
    - 고정지출
    - 짠테크
    ig_format: carousel

  # ------------------------------------------------------ 016-office-chair
  - id: 016-office-chair
    product: 10만원 의자 vs 100만원 의자
    price: 10배 가격차
    hook: 앉는 데 100만원? 그런데 하루 8시간 앉는다면.
    verified: true
    ask: 쓰는 의자 가격과 구매 시기
    threads_tag: 홈오피스
    threads_question: 의자에 얼마까지 써봤음? 후회했음?
    verify:
    - 구체 가격·의료 효과는 주장하지 않음 — 사용 시간 기준 계산만
    cards:
    - title: 하루 사용 시간이 압도적이다
      body: 옷은 하루 몇 시간, 신발은 몇 시간 신을까. 의자는 재택이든 사무실이든 하루 8시간 이상 몸에 닿는다. 시간당 비용으로 보면 순위가 완전히 바뀐다.
    - title: 시간당 비용으로 환산
      body: 가격 ÷ (하루 사용 시간 × 365 × 사용 연수) = 시간당 비용. 5년을 쓴다고 가정하면 10배 가격차가 시간당으로는 아주 작은 차이가 된다.
      note: 이 계산은 매트리스에도 그대로 적용된다.
    - title: 비싼 값의 정체는 내구성
      body: 저가 의자는 쿠션이 주저앉고 부품이 헐거워지는 시점이 빨리 온다. 2년마다 교체하면 총비용은 생각보다 빠르게 따라붙는다.
    - title: 다만 100만원이 상한은 아니다
      body: 가격과 편안함이 비례하는 구간은 어느 지점에서 끝난다. 그 위는 브랜드와 디자인 값이다. 중간 가격대에서 체형에 맞는 걸 고르는 게 대체로 낫다.
    verdict: 4
    verdict_text: 최저가도 답이 아니고 최고가도 답이 아니다. 중간 가격대에서 체형에 맞는 걸 고르는 게 답이다.
    caption: |
      비싼 의자, 돈값하나?

      우리는 하루 1시간 신는 신발에는 돈을 쓰고
      하루 8시간 앉는 의자에는 안 씁니다.

      시간당 비용으로 계산하면
      순위가 완전히 뒤집혀요.

      의자에 얼마까지 써보셨어요?
    threads_text: |
      제일 이상한 소비 패턴.

      하루 1시간 신는 신발 → 20만원 OK
      하루 8시간 앉는 의자 → 10만원도 비쌈

      시간당 비용으로 나눠보면
      이게 얼마나 이상한지 바로 보임.

      매트리스도 똑같음.
      하루 7시간 쓰는데 제일 아끼는 물건임.
    threads_chain:
    - |
      100만원짜리가 정답이라는 소리는 아님.
      30~40만원대에서 체감은 거의 끝남.
      그 위는 조절 기능값이라 안 쓰면 버리는 돈임.
    - |
      중고로 가는 방법도 있음.
      사무용 의자는 회사 이전할 때 대량으로 풀림.
      잘 고르면 3분의 1 가격임.
    hashtags:
    - 돈값하나
    - 가성비
    - 홈오피스
    - 소비습관
    - 재택근무

