      - "해당 자격 수당 지급 여부와 금액 (회사 취업규칙 확인)"
    cards:
      - title: "자격증은 세 종류다"
        body: "① 수당이 붙는 것 ② 없으면 지원조차 안 되는 것 ③ 아무 영향 없는 것. ③에 돈을 쓰는 경우가 생각보다 많다."
      - title: "회수 기간 공식"
        body: "(학원비 + 응시료 + 교재비) ÷ 월 수당 = 회수 개월수. 이 숫자가 24개월을 넘으면 투자가 아니라 취미에 가깝다."
        note: "국비지원·내일배움카드로 학원비가 줄면 회수 기간이 크게 짧아진다. 먼저 확인할 것."
      - title: "가장 큰 비용은 시간"
        body: "학원비보다 공부에 들어가는 시간이 더 비싸다. 준비 100시간짜리 자격증은 내 시급 × 100시간이 진짜 원가다."
      - title: "먼저 할 일"
        body: "회사 취업규칙에서 자격 수당 항목을 확인하는 것. 채용공고에 그 자격이 실제로 요구되는지 검색해보는 것. 이 둘이 5분이면 끝난다."
    verdict: 4
    verdict_text: "수당이나 지원 자격에 직접 연결되면 회수 기간이 짧아 돈값한다. 연결고리 없이 '있으면 좋겠지'로 시작하면 대체로 회수 안 된다."
    caption: |
      자격증 학원비, 돈값하나?

      공식은 하나입니다.
      (학원비 + 응시료 + 교재비) ÷ 월 수당 = 회수 개월수

      24개월 넘으면 투자보다 취미에 가깝습니다.

      시작 전에 5분만 쓰세요.
      ① 취업규칙 자격수당 항목 확인
      ② 채용공고에 실제로 요구되는지 검색
    threads_text: |
      자격증 딸지 말지 고민될 때.

      (학원비 + 응시료 + 교재비) ÷ 월 자격수당 = 회수 개월수

      24개월 넘어가면 투자라기보다 취미입니다.

      근데 진짜 비용은 학원비가 아니라 시간이에요.
      준비 100시간짜리면 내 시급 × 100이 원가입니다.

      시작 전에 취업규칙 자격수당 항목부터 확인하세요.
      5분이면 끝납니다.
    hashtags: ["돈값하나", "자격증", "직장인공부", "자기계발", "커리어"]

