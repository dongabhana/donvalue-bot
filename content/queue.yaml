  - id: "008-commute-vs-rent"
    product: "회사 앞 자취 vs 왕복 1시간 통근"
    price: "월 총비용"
    hook: "월세 차액만 보면 통근이 이긴다. 시간을 넣으면 뒤집힌다."
    verified: false
    verify:
      - "비교 지역 월세 시세"
      - "본인 통근 교통비 또는 유류비"
    cards:
      - title: "빠져 있는 항목"
        body: "보통 월세만 비교한다. 실제로는 교통비, 통근 시간, 통근 때문에 사 먹게 되는 끼니, 피로로 못 하는 일까지가 전부 비용이다."
      - title: "시간을 금액으로"
        body: "왕복 1시간 × 22일 = 월 22시간. 여기에 본인 시급을 곱하면 통근의 숨은 가격이 나온다. 월세 차액과 이 금액을 더해서 비교해야 한다."
        note: "지하철에서 책을 읽거나 공부를 한다면 이 시간의 손실은 줄어든다. 사람마다 다르다."
      - title: "회사 앞의 숨은 비용"
        body: "반대편도 공짜는 아니다. 회사와 가까우면 호출·잔업에 노출되기 쉽고, 생활권과 회사가 겹쳐 퇴근 후 전환이 잘 안 된다."
      - title: "판단 기준"
        body: "월세 차액이 '월 통근시간 × 시급'보다 작으면 회사 앞이 유리하다. 크면 통근이 유리하다. 딱 이 한 줄로 정리된다."
    verdict: 3
    verdict_text: "월세 차액과 '월 통근시간 × 시급'을 나란히 놓는 순간 결론이 난다. 시급이 오를수록 회사 앞이 유리해진다."
    caption: |
      회사 앞 자취 vs 통근, 돈값하나?

      월세만 비교하면 통근이 이깁니다.
      시간을 넣으면 자주 뒤집힙니다.

      왕복 1시간 × 22일 = 월 22시간
      × 내 시급 = 통근의 숨은 가격

      이 금액이 월세 차액보다 크면 회사 앞이 유리합니다.
    threads_text: |
      회사 앞 자취 vs 통근, 계산 한 줄로 끝납니다.

      월세 차액 vs (월 통근시간 × 내 시급)

      왕복 1시간이면 월 22시간입니다.
      이걸 금액으로 바꿔서 월세 차액과 비교하세요.

      시급이 오를수록 회사 앞이 유리해집니다.
      대신 회사 앞은 호출·잔업 노출이라는 비용이 따로 붙습니다.
    hashtags: ["돈값하나", "자취", "통근", "직장인", "월세"]

