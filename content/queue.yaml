      기준선이 생각보다 정확하게 있습니다. 90분이에요.

      30분 외출 후 재가동 → 전력 5% 증가
      60분 외출 후 재가동 → 2% 증가
      90분을 넘겨야 끄는 쪽이 이깁니다.

      참고로 '제습이 더 싸다'는 말은 시험 결과로는 근거가 약했습니다.
      24℃ 냉방 1.782kWh, 24℃ 제습 1.878kWh로 오히려 제습이 조금 더 썼어요.

      그보다 훨씬 크게 작용하는 건 설정 온도 2도입니다.
