      body: 이 기준은 인버터형 얘기다. 정속형은 설정 온도에 도달한 뒤 2시간쯤 꺼두는 편이 낫다. 오래된 모델이면 먼저 확인해야 한다.
    - title: 제습이 더 싸다는 말
      figure: 1.782 vs 1.878
      figure_label: 24℃ 냉방 / 24℃ 제습 소비전력(kWh)
      body: 한국소비자원 시험에서 24℃ 냉방은 1.782kWh, 같은 온도 제습은 1.878kWh였다. 오히려 제습이 조금 더 썼다.
      note: '''제습으로 돌리면 전기세 아낀다''는 말은 근거가 약하다.'
