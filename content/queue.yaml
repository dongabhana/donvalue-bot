    verdict_text: 월세 차액이 '월 통근시간 × 시급'보다 작으면 회사 앞이 답이다. 크면 통근이 답이다. 한 줄로 끝난다.
    caption: |
      회사 앞 자취 vs 통근, 돈값하나?

      월세만 비교하면 통근이 이깁니다.
      시간을 넣으면 자주 뒤집힙니다.

      왕복 1시간 × 22일 = 월 22시간
      × 내 시급 = 통근의 숨은 가격

      이 금액이 월세 차액보다 크면 회사 앞이 유리합니다.
    threads_text: |
      회사 앞 자취 vs 왕복 1시간 통근.
      계산 한 줄로 끝남.

      월세 차액 vs (월 통근시간 × 내 시급)

      왕복 1시간이면 월 22시간임.
      이걸 돈으로 바꿔서 월세 차액이랑 비교하면 됨.

      시급 오를수록 회사 앞이 유리해짐.
      근데 회사 앞은 호출이랑 잔업 노출이라는 비용이 따로 붙음.
      이건 숫자로 안 잡히는데 은근 큼.
    threads_chain:
    - |
      숫자로 안 잡히는 비용이 한쪽에 몰려 있음.
      회사 앞은 호출이 쉬움. 잔업도 자연스러워짐.
