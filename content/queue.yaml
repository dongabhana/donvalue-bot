      figure: 90분
      figure_label: 이보다 길게 나갈 때만 끄는 게 이득
      body: 삼성전자 실험 기준으로 30분 외출 후 재가동은 전력이 5% 늘고, 60분은 2% 늘었다. 90분을 넘겨야 끄는 쪽이 이긴다.
      note: 잠깐 나갔다 오면서 끄는 습관이 오히려 더 쓰게 만드는 구간이 있다는 뜻이다.
