    - '한국소비자원 시험: 냉방 24℃ 1.782kWh vs 제습 24℃ 1.878kWh (5개 모델 평균)'
    - 26℃ 설정이 24℃ 대비 전력 0.7배 (2시간 기준)
    - 본인 에어컨이 인버터형인지 정속형인지 (모델명 검색)
