      figure_label: 26℃ 설정이 24℃ 대비 쓰는 전력
      body: 껐다 켜기를 고민하는 것보다 설정 온도를 2도 올리는 쪽이 훨씬 크게 작용한다. 2시간 기준 측정값이다.
