    threads_text: |
      전기 아끼면 한전이 현금 돌려주는 제도 있음. 에너지캐시백.

      과거 평균 대비 1%만 덜 써도 kWh당 30원
      10% 줄이면 100원
      20~30%면 120원

      400kWh → 360kWh면 40kWh × 100원 = 4,000원임.

      한전ON이나 슬기로운 전기생활 앱에서 신청, 연중 상시임.
      한 번 하면 재신청도 필요 없음.
    threads_chain:
    - |
      금액 자체는 크지 않음. 솔직히 몇 천원 단위임.
      근데 아무것도 더 안 하고 받는 돈이라 안 받을 이유가 없음.
      신청 안 하면 아무리 아껴도 0원임.
    - |
      아파트면 단지 단위로 참여하는 경우도 있음.
      관리사무소에 물어보면 바로 알려줌.
