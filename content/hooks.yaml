# ============================================================
#  릴스 훅 시트 — 편당 '첫 3초'를 여기 한 곳에서 관리한다.
#
#  queue.yaml 의 id 와 1:1로 붙는다. 로드 시 item["reel"] 로 합쳐진다.
#  훅만 모아 두면 편끼리 비교가 되고, 어떤 패턴이 먹혔는지 추적할 수 있다.
#
#  필드
#    pattern      loss | number | contrarian | threshold | callout | reveal
#                 (src/hooks.py 의 PATTERNS 참고. 한 패턴만 반복하면 계정이 빨리 질린다)
#    badge        화면 좌상단 골드 알약. 금액·단위 (없으면 생략)
#    big          대문짝 훅. 1~3줄, 한 줄 13자 이내. 한 줄씩 튀어나온다
#    sub          훅 아래 한 줄. 34자 이내
#    stake        2번째 씬 — '왜 계속 봐야 하는지'. 40자 이내
#    beats        본문 씬 문구. cards 순서와 같게, 46자 이내 (없으면 card.body 를 잘라 씀)
#    loop         마지막 씬 문구. 첫 씬으로 되감기는 느낌으로
#    caption_hook 인스타 캡션 첫 줄. 릴스 훅과 '다른 각도'로 써야 두 번 걸린다
#    mood         배경음 분위기 calm | focus | warm
#  voice        결론 카드 아래 붙는 화자 한 줄 (1인칭, 30자 이내)
#               ⚠ 아래 값들은 '톤 예시 초안'이다. 사실이 아닌 문장은 반드시 고칠 것.
#  (포맷은 여기가 아니라 queue.yaml 의 ig_format / ig_format_by_weekday 가 정한다)
#
#  숫자 원칙: 검증된 금액만 쓴다. 확인 안 된 금액은 '횟수/개월/배수'로 바꿔 쓴다.
# ============================================================

022-aircon-90min:
  pattern: number
  badge: 기준선 90분
  big:
  - 90분
  - 이게 기준이다
  - 그 전엔 켜둬라
  sub: 30분 나갔다 오면 오히려 5% 더 쓴다
  stake: 껐다 켜기, 기준선이 정확히 있다
  beats:
  - 30분 외출 후 재가동은 전력 5% 증가, 60분은 2% 증가.
  - 이건 인버터형 기준. 정속형은 2시간쯤 꺼두는 게 낫다.
  - 냉방 24℃ 1.782kWh vs 제습 24℃ 1.878kWh. 제습이 더 썼다.
  - 26℃는 24℃ 대비 전력 0.7배. 2도가 껐다 켜기보다 훨씬 크다.
  loop: 몰라서 내는 돈
  voice: 나도 나갈 때마다 껐다
  caption_hook: 에어컨 껐다 켜는 게 아깝다 싶었는데, 기준선이 생각보다 정확하게 있었습니다.
  mood: focus

