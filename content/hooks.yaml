004-ott-stack:
  pattern: number
  badge: 1시간당 단가
  big:
  - 한 달에 2시간
  - 본 OTT
  - 시간당 얼마?
  sub: 요금 말고 시청시간으로 줄 세워라
  stake: 요금은 다 비슷하다. 갈리는 건 본 시간이다
  beats:
  - OTT는 전부 만원 안팎. 가격은 비교 기준이 못 된다.
  - 월 요금 ÷ 그 달에 본 시간 = 1시간당 비용.
  - 시리즈 하나 보려고 결제하고 그대로 둔 게 제일 크게 샌다.
  - 상시 2개 + 볼 때만 켜기. 연 단위로 절반 이하가 된다.
  loop: 그래서, 돈값하나?
  caption_hook: 구독 4개 중 뭘 끊을지 고민될 때, 요금표 말고 시청시간을 보세요.
  mood: calm
  voice: 네 개 중 두 개는 안 봤다

005-mvno:
  pattern: loss
  badge: 2년 차액
  big:
  - 저녁 한 번이면
  - 2년치 차액이
  - 그대로 남는다
  sub: 귀찮음의 가격을 계산해봤다
  stake: 품질 차이는 작고 가격 차이만 큰 항목
  beats:
  - 같은 통신망을 빌려 쓴다. 통화·데이터 품질 차이가 작다.
  - 월 차액 × 24개월 = 갈아타기 한 번의 가치.
  - '확인 3개: 약정·할부 / 결합할인 / 실제 쓰던 멤버십.'
  - 무제한 기준으로 고르지 말 것. 최근 3개월 실사용량부터.
  loop: 그래서, 돈값하나?
  caption_hook: 통신비는 참는 항목이 아니라 한 번 손보고 끝내는 항목입니다.
  mood: focus
  voice: 저녁 한 번 쓰고 끝났다

007-dishwasher:
  pattern: reveal
  badge: 회수 기간
  big:
  - 하루 20분
  - 1년이면
  - 120시간
  sub: 가전은 가격이 아니라 회수 기간이다
  stake: 내 시급을 넣는 순간 기기값이 작아진다
  beats:
  - 시간 아껴주는 가전은 '가격 ÷ 아끼는 시간의 가치'로 본다.
  - 연봉 ÷ 2,000시간 ≈ 시급. 여기에 연 120시간을 곱해본다.
  - '빠지기 쉬운 비용: 설치비·전용세제·전기수도, 그리고 방치 확률.'
  - 로봇청소기·건조기도 같은 공식. 가끔 쓰는 가전은 회수가 안 된다.
  loop: 그래서, 돈값하나?
  caption_hook: 식기세척기가 비싼지 싼지는 가격표가 아니라 본인 시급이 정합니다.
  mood: warm
  voice: 시급 넣어보고 바로 샀다

008-commute-vs-rent:
  pattern: threshold
  badge: 월 총비용
  big:
  - 왕복 1시간은
  - 월 22시간
  - 공짜가 아니다
  sub: 월세 차액에 시급을 더해야 비교가 된다
  stake: 한 줄이면 이사할지 말지 정해진다
  beats:
  - 월세만 비교한다. 교통비·시간·끼니·피로까지가 전부 비용이다.
  - 왕복 1시간 × 22일 = 월 22시간. 여기에 본인 시급을 곱한다.
  - 회사 앞도 공짜는 아니다. 호출·잔업 노출이 커진다.
  - 월세 차액 < 월 통근시간 × 시급 이면 회사 앞이 유리.
  loop: 그래서, 돈값하나?
  caption_hook: 통근은 교통비가 아니라 시간으로 계산해야 금액이 제대로 보입니다.
  mood: calm
  voice: 왕복 두 시간을 버텨봤다

009-certificate:
  pattern: callout
  badge: 회수 기간
  big:
  - 있으면 좋겠지로
  - 시작한 자격증
  - 회수 안 된다
  sub: 수당으로 돌아오는 것만 투자다
  stake: 학원비보다 공부 시간이 더 비싸다
  beats:
  - 자격증은 셋. 수당 붙는 것 / 없으면 지원 불가 / 아무 영향 없는 것.
  - (학원비+응시료+교재) ÷ 월 수당 = 회수 개월수. 24개월 넘으면 취미.
  - 준비 100시간짜리는 내 시급 × 100시간이 진짜 원가다.
  - 취업규칙의 자격수당 항목 확인. 5분이면 끝난다.
  loop: 그래서, 돈값하나?
  caption_hook: 자격증을 투자로 만들려면 수당이든 지원자격이든 연결고리가 먼저 있어야 합니다.
  mood: focus
  voice: 수당 없는 자격증부터 땄다

010-coffee:
  pattern: number
  badge: 연 환산
  big:
  - 하루 한 잔이
  - 1년이면
  - 260잔
  sub: 한 잔 가격으론 판단이 안 된다
  stake: 연 환산해야 다른 지출과 비교가 된다
  beats:
  - 한 잔 가격은 너무 작아서 뇌가 '이 정도쯤'으로 처리한다.
  - 한 잔 × 주 5일 × 52주 = 연간 커피값.
  - 홈카페도 공짜가 아니다. 아침 15분이 연 60시간.
  - 끊기 말고 빈도. 주 5회를 2회로만 바꿔도 절반 이하.
  loop: 그래서, 돈값하나?
  caption_hook: 커피를 줄이라는 얘기가 아닙니다. 연간 금액을 모르고 마시는 게 문제입니다.
  mood: warm
  voice: 연 환산 보고 빈도를 줄였다

011-ai-subscription:
  pattern: threshold
  badge: 월 구독
  big:
  - 무료로 막히는
  - 순간이
  - 한 달에 몇 번?
  sub: 그 횟수가 구독료를 정한다
  stake: 3개 동시 결제, 활용은 1.3배에 그친다
  beats:
  - 유료의 값어치는 기능 개수가 아니라 막히는 순간의 빈도다.
  - 구독료 ÷ 시급 = 몇 시간 아껴야 본전인지. 한 자리면 대체로 이득.
  - 여러 개를 같이 쓰면 사용 빈도가 쪼개진다. 하나를 깊게.
  - 매일 쓰는 일이면 무조건 이득, 가끔 검색 대용이면 무료로 충분.
  loop: 그래서, 돈값하나?
  caption_hook: AI 구독은 기능표로 고르는 게 아니라 '무료로 막힌 횟수'로 고르는 겁니다.
  mood: focus
  voice: 세 개 쓰다 하나로 줄였다

012-youtube-premium:
  pattern: number
  badge: 월 구독
  big:
  - 하루 광고 20개
  - 한 달이면
  - 2시간 반
  sub: 광고값이 아니라 시간값이다
  stake: 백그라운드 재생까지 세면 계산이 달라진다
  beats:
  - 광고 15초 × 하루 20개 = 5분. 한 달이면 2시간 반.
  - 화면 끄고 듣는 기능이 음악 구독을 대체하면 두 값이 하나가 된다.
  - 하루 30분 이하로 보면 절약되는 시간이 얼마 안 된다.
  - 같이 쓸 사람이 있는지가 1인당 부담을 크게 바꾼다.
  loop: 그래서, 돈값하나?
  caption_hook: 프리미엄은 광고를 지우는 값이 아니라 한 달에 두 시간 반을 사는 값입니다.
  mood: calm
  voice: 백그라운드 때문에 유지 중

015-card-annual-fee:
  pattern: threshold
  badge: 연 단위
  big:
  - 할인율 말고
  - 월 한도부터
  - 보세요
  sub: 본전을 정하는 건 한도다
  stake: 실적 채우려 쓴 돈은 할인이 아니라 지출
  beats:
  - 10% 할인이어도 월 한도가 낮으면 그 위로는 혜택이 없다.
  - 전월 실적 조건. 채우려고 쓴 돈은 할인이 아니다.
  - 연회비 ÷ 12 = 매달 확실히 챙겨야 할 최소 할인액.
  - 혜택 항목이 많아도 실제로 쓰는 건 한두 곳뿐이다.
  loop: 그래서, 돈값하나?
  caption_hook: 연회비 본전은 할인율이 아니라 '월 최대 할인 한도'가 정합니다.
  mood: focus
  voice: 실적 채우려고 더 썼었다

018-mvno-vs-5g:
  pattern: callout
  badge: 월 요금
  big:
  - 무제한 쓰는데
  - 실사용량
  - 본 적 있나요
  sub: 대부분 생각보다 훨씬 적게 쓴다
  stake: 확인해본 적 없다면 십중팔구 과지출 중
  beats:
  - 휴대폰 설정에서 최근 3개월 데이터 사용량을 볼 수 있다.
  - 집·회사 와이파이면 셀룰러는 이동 중으로만 한정된다.
  - 월 차액 × 12 = 연간 절약액. 걱정보다 큰 금액이 나온다.
  - 알뜰폰 약점은 품질이 아니라 고객센터·멤버십·결합할인.
  loop: 그래서, 돈값하나?
  caption_hook: 요금제를 바꾸기 전에 딱 하나만 보세요. 최근 3개월 실제 데이터 사용량.
  mood: calm
  voice: 3개월 사용량 보고 바꿨다

019-dryer:
  pattern: reveal
  badge: 구매 + 전기료
  big:
  - 널고 걷는 시간
  - 주 단위로
  - 세보면 끝
  sub: 시간을 사는 가전으로 보면 명확하다
  stake: 건조대가 차지하던 자리값도 계산에 넣어라
  beats:
  - 널고 걷는 시간을 주 단위로 세고 본인 시급을 곱한다.
  - 건조대 자리와 실내 건조 습기·냄새가 사라진다. 좁을수록 크다.
  - 고온 건조는 일부 소재를 상하게 한다. 그 옷은 따로 널어야 한다.
  - 주 1회 몰아 빨고 베란다가 넓으면 회수 기간이 길어진다.
  loop: 그래서, 돈값하나?
  caption_hook: 건조기는 빨래 가전이 아니라 시간 가전입니다. 계산식이 완전히 달라집니다.
  mood: warm
  voice: 없던 시절로는 못 돌아간다

