name: Codex preview approvals and publishing
on:
  push:
    branches: [main]
    paths:
      - 'codex/threshold_specs.json'
      - 'codex/build_threshold_queue.py'
      - '.github/workflows/codex-approval.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'tick is normal approval/publishing; preview is an explicit non-publishing test'
        type: choice
        options: [preview, tick]
        default: tick
permissions:
  contents: write
concurrency:
  group: donvalue-publish
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk ffmpeg
          pip install -r requirements.txt
      - name: Build and persist threshold queue
        run: |
          python codex/build_threshold_queue.py
          git config user.name donvalue-bot
          git config user.email bot@users.noreply.github.com
          git add codex/content.json
          if ! git diff --cached --quiet; then
            git commit -m 'Activate GPT threshold-track queue'
            git pull --rebase origin main
            git push origin main
          fi
      - name: Verify approval invariants
        run: python -m unittest discover -s codex/tests -v
      - name: Run isolated Codex engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TH_USER_ID: ${{ secrets.TH_USER_ID }}
          TH_ACCESS_TOKEN: ${{ secrets.TH_ACCESS_TOKEN }}
          MODE_INPUT: ${{ inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mode=tick
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$MODE_INPUT" = preview ]; then mode=preview; fi
          python -m codex.engine "$mode"
