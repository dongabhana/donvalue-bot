name: 0년 컷툰 릴스

# 2026-11-09 소유자 결정: 인스타 계정을 「0년」 컷툰으로 바꾸고, 15장 컷툰을 릴스로 이어 붙여
# 월·수·금 21:20 KST 에 자동 게시한다(src/toon.py). 돈값하나 본편은 유튜브에만 나간다(post.yml).
# 예약 실행이 빠지는 날을 대비해 발행 시계(tools/publish_clock.py)도 같은 시각에 이 파일을 dispatch 한다.
# 둘 다 돌아도 '오늘 이미 한 화' 검사가 두 번 올리는 것을 막는다.

on:
  schedule:
    - cron: "0 8 * * 1,3,5"    # 월·수·금 17:00 KST
    - cron: "0 9 * * 1,3,5"    # 보조 18:00
    - cron: "0 10 * * 1,3,5"   # 보조 19:00
  workflow_dispatch:
    inputs:
      episode:
        description: "특정 화만 (예: ep01). 비우면 다음 화"
        required: false
        default: ""
      dry_run:
        description: "true 면 영상만 만들고 게시하지 않음(Artifacts 에서 mp4 확인)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: donvalue-toon
  cancel-in-progress: false

jobs:
  toon:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: ffmpeg 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 컷툰 릴스 게시
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_LABEL: "🟠 0년 컷툰"
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.episode }}" ]; then
            ARGS="$ARGS --episode ${{ github.event.inputs.episode }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python -m src.toon $ARGS

      - name: 만든 영상 올려 두기(미리보기용)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toon-reel
          path: images/toon/
          if-no-files-found: ignore
          retention-days: 7
