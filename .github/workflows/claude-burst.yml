name: Claude four carousels without approval - resume safely 2026-09-12
on:
  push:
    branches: [main]
    paths: [.github/workflows/claude-burst.yml]
  workflow_dispatch:
jobs:
  clear_wait:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: Stop obsolete one-item approval wait
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(TZ=Asia/Seoul date +%F)" != 2026-09-12 ]; then exit 0; fi
          recovery_status=$(gh api repos/${{ github.repository }}/actions/runs/34678150695 --jq .status)
          case "$recovery_status" in
            completed) echo 'Previous recovery already stopped' ;;
            *) gh api --method POST repos/${{ github.repository }}/actions/runs/34678150695/cancel ;;
          esac
          burst_status=$(gh api repos/${{ github.repository }}/actions/runs/34678569412 --jq .status)
          case "$burst_status" in
            completed) echo 'Original burst already stopped' ;;
            *) gh api --method POST repos/${{ github.repository }}/actions/runs/34678569412/cancel ;;
          esac
  publish:
    needs: clear_wait
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    concurrency:
      group: donvalue-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk ffmpeg
          pip install -r requirements.txt
      - name: Verify publishing and duplicate guards
        run: python -m unittest discover -s codex/tests -q
      - name: Publish the requested four cards
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TH_USER_ID: ${{ secrets.TH_USER_ID }}
          TH_ACCESS_TOKEN: ${{ secrets.TH_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APPROVAL_REQUIRED: '0'
          BURST_GAP_MIN: '40'
          STAGGER_MIN: '10'
          NOTIFY_LABEL: '🟠 Claude · 카드뉴스 4편 연속 발행'
          THEME: paper
        run: python -u -m tools.claude_burst_once
      - name: Save renders if publishing stops
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: claude-four-cards
          path: images/
          retention-days: 7
