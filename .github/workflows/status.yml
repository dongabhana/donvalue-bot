name: 발행 상태 점검
on:
  schedule:
    # 매일 22:50 KST — 그날 슬롯(21:20/15:30)이 끝난 뒤 텔레그램으로 점검표를 보낸다.
    - cron: "50 13 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: 상태 출력 (편 ID·상태만, 비밀값 없음)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python tools/pipeline_status.py
      - name: 텔레그램 일일 점검표
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tools/pipeline_status.py --notify
