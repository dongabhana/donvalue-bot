name: 돈값하나 유튜브 쇼츠 백필

# 평소 발행(post.yml)은 릴스를 만든 자리에서 같은 mp4 를 쇼츠로도 올립니다.
# 이 워크플로는 **이미 인스타에만 나간 편**을 유튜브에 따라 올리는 용도입니다.
# 채널이 비어 있으면 들어온 사람이 그냥 나가므로, 초반에 과거 편을 깔아둡니다.

on:
  workflow_dispatch:
    inputs:
      item_id:
        description: "특정 편 id (비우면 발행 순서대로 오래된 것부터)"
        required: false
        default: ""
      count:
        description: "몇 편 올릴지"
        required: false
        default: "1"
      dry_run:
        description: "true 면 영상만 만들어 텔레그램으로 보냄 (업로드 안 함)"
        required: false
        default: "true"
      privacy:
        description: "private | unlisted | public — 심사 통과 전에는 private 만 의미 있음"
        required: false
        default: "private"
      crf:
        description: "화질/용량 — 20 기본(편당 10MB 안팎) | 28 가벼움(편당 3MB 안팎). 업로드 용량 제한이 있을 때 28"
        required: false
        default: "20"
      tts_voice:
        description: "목소리 — SunHi(여) | InJoon(남·뉴스) | HyunsuMultilingual(남). 비우면 ko-KR-SunHiNeural"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: donvalue-youtube-shorts
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 한글 폰트 · ffmpeg 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk ffmpeg

      - name: ffmpeg 확인
        run: ffmpeg -version

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 쇼츠 백필
        env:
          # 두 형태 다 받습니다. 있는 쪽이 쓰입니다.
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YT_PRIVACY: ${{ github.event.inputs.privacy || 'private' }}
          YT_CATEGORY_ID: "22"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APPROVAL_REQUIRED: "1"
          APPROVAL_TIMEOUT_MIN: "45"
          NOTIFY_LABEL: "🔴 YouTube"
          YT_BACKFILL_GAP_MIN: "5"
          REEL_TTS: "1"
          TTS_VOICE: ${{ github.event.inputs.tts_voice }}
          REEL_CRF: ${{ github.event.inputs.crf || '20' }}
          TTS_RATE: "+22%"
          REEL_MUSIC_VOICE_DB: "-13"
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          ARGS="--count ${{ github.event.inputs.count || '1' }}"
          if [ -n "${{ github.event.inputs.item_id }}" ]; then
            ARGS="$ARGS --id ${{ github.event.inputs.item_id }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" != "false" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python -m src.youtube_run $ARGS

      # 영상 + 제목·설명 텍스트를 한 폴더로 받는다. 유튜브에 손으로 올릴 때
      # 제목·설명을 다시 짜맞출 필요가 없게 하려는 것.
      - name: 완성본 내려받기 (영상 + 제목/설명)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-bundle
          path: out/**
          retention-days: 14
          if-no-files-found: ignore
