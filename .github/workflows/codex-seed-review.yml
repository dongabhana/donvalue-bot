name: Codex reviewed Threads recovery and remaining seed posts
on:
  push:
    branches: [main]
    paths: [.github/workflows/codex-seed-review.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: donvalue-publish
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install carousel dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          pip install -r requirements.txt
      - run: python -m unittest discover -s codex/tests -q
      - name: Publish reviewed coupon container once and resume remaining seed cards
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TH_USER_ID: ${{ secrets.TH_USER_ID }}
          TH_ACCESS_TOKEN: ${{ secrets.TH_ACCESS_TOKEN }}
        run: python -u -m codex.seed_recovery_finish
