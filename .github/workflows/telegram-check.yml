name: Telegram bot connection check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/check_telegram.py
      - .github/workflows/telegram-check.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate bot identity without exposing token
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python tools/check_telegram.py
