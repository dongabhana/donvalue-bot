name: 돈값하나 자동 발행

on:
  schedule:
    # 화·목·일 20:00 KST (= 11:00 UTC). GitHub cron 은 UTC 기준이며
    # 러너 혼잡도에 따라 수 분~수십 분 지연될 수 있습니다.
    - cron: "0 11 * * 0,2,4"
  workflow_dispatch:
    inputs:
      item_id:
        description: "특정 항목 id 를 강제 발행 (비우면 큐 순서대로)"
        required: false
      dry_run:
        description: "true 면 렌더링만 하고 발행하지 않음"
        required: false
        default: "false"
      skip_threads:
        description: "true 면 쓰레드는 건너뛰고 인스타에만 발행 (이미 올린 편의 릴스 추가용)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: donvalue-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 한글 폰트 · ffmpeg 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk ffmpeg

      - name: ffmpeg 확인 (없으면 여기서 실패해야 한다)
        run: ffmpeg -version

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 발행
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TH_USER_ID: ${{ secrets.TH_USER_ID }}
          TH_ACCESS_TOKEN: ${{ secrets.TH_ACCESS_TOKEN }}
          SKIP_THREADS: ${{ github.event.inputs.skip_threads }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.item_id }}" ]; then
            ARGS="$ARGS --id ${{ github.event.inputs.item_id }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python -m src.run $ARGS

      - name: 실패 시 렌더 결과 남기기
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-cards
          path: images/
          retention-days: 7
