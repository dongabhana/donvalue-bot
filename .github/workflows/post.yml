name: 돈값하나 자동 발행

on:
  schedule:
    # 화·목·일 20:00 KST (= 11:00 UTC). GitHub cron 은 UTC 기준이며
    # 러너 혼잡도에 따라 수 분~수십 분 지연될 수 있습니다.
    - cron: "0 11 * * 0,2,4"
  workflow_dispatch:
    inputs:
      item_id:
        description: "특정 항목 id 를 강제 발행 (비우면 큐 순서대로)"
        required: false
      pick:
        description: "이 포맷으로 지정된 편만 고름 — carousel | reel (비우면 전체)"
        required: false
        default: ""
      count:
        description: "한 번에 낼 편 수 (프로필 채울 때만 크게. 1회 6편 이하 권장)"
        required: false
        default: "1"
      approval:
        description: "텔레그램 승인 요구 — true | false"
        required: false
        default: "true"
      reel_style:
        description: "릴스 화면 scene | cards (비우면 scene)"
        required: false
        default: "scene"
      theme:
        description: "디자인 테마 paper | midnight"
        required: false
        default: "paper"
      dry_run:
        description: "true 면 렌더링만 하고 발행하지 않음"
        required: false
        default: "false"
      skip_threads:
        description: "true 면 쓰레드는 건너뛰고 인스타에만 발행"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: donvalue-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # 승인 대기(기본 45분) + 연속 발행 간격까지 감안한 여유. GitHub 한도는 6시간.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 한글 폰트 · ffmpeg 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk ffmpeg

      - name: ffmpeg 확인 (없으면 여기서 실패해야 한다)
        run: ffmpeg -version

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 발행
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TH_USER_ID: ${{ secrets.TH_USER_ID }}
          TH_ACCESS_TOKEN: ${{ secrets.TH_ACCESS_TOKEN }}
          # 텔레그램 승인 — 두 값이 없으면 승인 단계를 조용히 건너뜁니다.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APPROVAL_REQUIRED: ${{ github.event.inputs.approval == 'false' && '0' || '1' }}
          APPROVAL_TIMEOUT_MIN: "45"
          BURST_GAP_MIN: "40"
          REEL_STYLE: ${{ github.event.inputs.reel_style }}
          REEL_MUSIC_DB: "-3"
          THEME: ${{ github.event.inputs.theme }}
          SKIP_THREADS: ${{ github.event.inputs.skip_threads }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.item_id }}" ]; then
            ARGS="$ARGS --id ${{ github.event.inputs.item_id }}"
          fi
          if [ -n "${{ github.event.inputs.pick }}" ]; then
            ARGS="$ARGS --pick ${{ github.event.inputs.pick }}"
          fi
          if [ -n "${{ github.event.inputs.count }}" ]; then
            ARGS="$ARGS --count ${{ github.event.inputs.count }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python -m src.run $ARGS

      # 드라이런일 때도 결과물을 받아야 검수가 됩니다(.preview 에 렌더됨).
      - name: 렌더 결과 내려받기
        if: failure() || github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rendered
          path: |
            images/
            .preview/
          retention-days: 7
          if-no-files-found: ignore
